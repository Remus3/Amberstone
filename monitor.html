<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Riot Commander</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0a0f;--card:#12121b;--border:#1a1a28;
  --text:#c0c0d0;--label:#606070;--dim:#303040;
  --green:#44ff88;--red:#ff4444;--gold:#ffdd44;--cyan:#00e5ff;
  --blue:#5599ff;--purple:#dd99ff;--orange:#ffaa66;
  --font:'JetBrains Mono',monospace;
}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;padding:12px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;border-bottom:1px solid var(--border);padding-bottom:12px}
.system-name{font-size:14px;font-weight:700;letter-spacing:2px;color:var(--cyan);text-shadow:0 0 12px rgba(0,229,255,0.4)}
.mode-tag{padding:3px 10px;border-radius:4px;font-size:11px;font-weight:700;letter-spacing:1px}
.header-right{display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
#ts{font-size:12px;color:var(--label)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;max-width:1400px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:16px;font-size:12px}
.card h2{font-size:11px;font-weight:700;letter-spacing:1px;color:var(--label);margin-bottom:8px;text-transform:uppercase}
.card.live{border-color:#223322}.card.warn{border-color:#444410}.card.alert{border-color:#441122}
.big{font-size:20px;font-weight:700;margin-bottom:8px}.big.ok{color:var(--green)}.big.err{color:var(--red)}
.hint{font-size:10px;color:var(--label);margin-top:4px}
.action{font-size:16px;font-weight:700;letter-spacing:1px;margin-bottom:8px;max-height:48px;overflow:hidden}
.stage-val{font-size:24px;font-weight:700;color:var(--cyan);letter-spacing:1px;margin-bottom:8px}
.champ-val{font-size:18px;font-weight:700;margin-bottom:6px;color:var(--cyan)}
.comp-name{font-size:14px;font-weight:700;color:var(--cyan);margin-bottom:8px;word-break:break-word}
.win-bar{height:4px;background:var(--border);border-radius:2px;margin:6px 0 8px}
.win-fill{height:100%;border-radius:2px;transition:width 0.3s}
.rows{display:flex;flex-direction:column;gap:3px}
.r{display:flex;justify-content:space-between;gap:4px;align-items:center}
.rl{color:var(--label);font-size:10px;white-space:nowrap;letter-spacing:0.5px}
.rv{font-size:11px;text-align:right;word-break:break-word}
.b{display:inline-block;padding:2px 6px;border-radius:3px;font-size:10px;font-weight:700;letter-spacing:0.5px}
.bg{background:rgba(68,255,136,0.15);color:#44ff88;border:1px solid rgba(68,255,136,0.3)}
.br{background:rgba(255,68,68,0.15);color:#ff4444;border:1px solid rgba(255,68,68,0.3)}
.by{background:rgba(255,221,68,0.15);color:#ffdd44;border:1px solid rgba(255,221,68,0.3)}
.bc{background:rgba(85,215,255,0.12);color:#44ccdd;border:1px solid rgba(85,215,255,0.25)}
.bp{background:rgba(204,136,255,0.15);color:#dd99ff;border:1px solid rgba(204,136,255,0.3)}
.bo{background:rgba(255,140,64,0.15);color:#ffaa66;border:1px solid rgba(255,140,64,0.3)}
.bs{background:rgba(85,153,255,0.15);color:#88bbff;border:1px solid rgba(85,153,255,0.3)}
</style>
</head>
<body>
<header>
  <div><span class="system-name">RIOT COMMANDER</span>&nbsp;<span class="mode-tag" id="mode-tag" style="background:rgba(80,80,30,.1);color:#5a8aa0;border:1px solid #1a3048">LOBBY</span></div>
  <div class="header-right"><span class="dot"></span><span id="ts">--:--:--</span></div>
</header>
<div class="grid">
  <div class="card" id="c-moon"><h2>MOON-PC</h2><div style="color:var(--dim)">...</div></div>
  <div class="card" id="c-game"><h2>GAME STATE</h2><div style="color:var(--dim)">...</div></div>
  <div class="card" id="c-coach"><h2>COACHING</h2><div style="color:var(--dim)">...</div></div>
  <div class="card" id="c-comp"><h2>COMP / CHAMP</h2><div style="color:var(--dim)">...</div></div>
  <div class="card" id="c-health"><h2>APP HEALTH</h2><div style="color:var(--dim)">...</div></div>
  <div class="card" id="c-live"><h2>VISION / LIVE</h2><div style="color:var(--dim)">...</div></div>
</div>
<script>
const G='http://192.168.8.237:8888';
const M='http://192.168.8.230:8889';
let moonOk=false;
function b(t,c){return`<span class="b b${c}">${t}</span>`}
function r(l,v){return`<div class="r"><span class="rl">${l}</span><span class="rv">${v}</span></div>`}
async function get(u){try{const x=await fetch(u,{signal:AbortSignal.timeout(3000)});return await x.json()}catch{return null}}
function getMode(h){if(!h)return'client';if(h.tft_mode)return'tft';if(h.aram_mode)return'aram';if(h.arena_mode)return'arena';if(h.brawl_mode)return'brawl';if(h.has_game)return'sr';return'client'}
function coachFile(m){return{tft:'data/tft_coaching_data.json',aram:'data/aram_coaching_data.json',arena:'data/arena_coaching_data.json',brawl:'data/brawl_coaching_data.json',sr:'coaching_data.json',client:'coaching_data.json'}[m]||'coaching_data.json'}
function modeTagHtml(m){const s={tft:'background:rgba(0,229,255,.15);color:#33eeff;border:1px solid rgba(0,229,255,.35)',aram:'background:rgba(204,136,255,.15);color:#dd99ff;border:1px solid rgba(204,136,255,.35)',arena:'background:rgba(255,140,64,.15);color:#ffaa66;border:1px solid rgba(255,140,64,.35)',brawl:'background:rgba(255,202,40,.15);color:#ffd44d;border:1px solid rgba(255,202,40,.35)',sr:'background:rgba(85,153,255,.15);color:#88bbff;border:1px solid rgba(85,153,255,.35)',client:'background:rgba(80,80,80,.1);color:#5a8aa0;border:1px solid #1a3048'}[m]||'';const l={tft:'TFT',aram:'ARAM',arena:'ARENA',brawl:'BRAWL',sr:'SR',client:'LOBBY'}[m]||m.toUpperCase();return`<span class="mode-tag" id="mode-tag" style="${s}">${l}</span>`}
async function doMoon(){const d=await get(`${M}/health`);const s=await get(`${M}/stats`);const el=document.getElementById('c-moon');moonOk=!!(d&&d.alive&&d.api_key_ok);if(!d){el.className='card';el.innerHTML='<h2>MOON-PC</h2><div class="big err">OFFLINE</div><div class="hint">pythonw moon_vision_server.py</div>';return}const up=d.uptime_s?`${Math.floor(d.uptime_s/3600)}h${Math.floor((d.uptime_s%3600)/60)}m`:'?';const vc=s?.stats?.vision?.calls||0;const cc=s?.stats?.coach?.calls||0;const ve=s?.stats?.vision?.errors||0;const avgMs=vc>0?Math.round((s?.stats?.vision?.total_ms||0)/vc):0;const lastLog=s?.log?.[s.log.length-1];el.className='card live';el.innerHTML='<h2>MOON-PC AGENT</h2><div class="big ok">LIVE</div><div class="rows">'+r('API',d.api_key_ok?b('OK','g'):b('MISSING','r'))+r('Uptime',up)+r('TOTAL CALLS','<span style="color:var(--cyan);font-weight:700">'+(vc+cc)+'</span>')+r('Vision',vc+' calls / '+avgMs+'ms avg')+r('Errors',ve>0?b(ve+' ERR','r'):b('0','g'))+r('Last',lastLog?.ts||'-')+'</div>'}
async function doGame(mode,h){const el=document.getElementById('c-game');if(mode==='tft'){const d=await get(`${G}/data/tft_live_data.json`);if(!d||d.mode!=='tft_live'){el.className='card';el.innerHTML='<h2>GAME STATE</h2><div style="color:var(--dim);font-size:11px;margin-top:4px">Not in TFT</div>';return}const hp=d.hp;const hpColor=!hp?'var(--label)':hp<=10?'var(--red)':hp<=25?'var(--gold)':'var(--green)';el.className=hp&&hp<=10?'card alert':hp&&hp<=25?'card warn':'card live';el.innerHTML='<h2>GAME STATE - TFT</h2><div class="stage-val">'+(d.stage_round||'?')+'</div><div class="rows">'+r('Level','<span style="font-weight:700;color:var(--text)">'+(d.level||'?')+'</span>')+r('HP',hp?'<span style="color:'+hpColor+';font-weight:700">'+hp+' HP</span>':'--')+r('Board',(d.board_units||[]).filter(u=>u&&u!='empty').length+' units')+r('Aug',d.augment_select?b('SELECT NOW','y'):b('--','c'))+'</div>';return}const mL={sr:'SR',aram:'ARAM',arena:'ARENA',brawl:'BRAWL'};const mC={sr:'sr',aram:'aram',arena:'arena',brawl:'arena'};el.className='card '+(mC[mode]||'');const cd=await get(`${G}/${coachFile(mode)}`);if(!cd||!h?.has_game){el.innerHTML='<h2>GAME STATE</h2><div style="color:var(--dim);font-size:11px;margin-top:4px">In Lobby</div>';return}const champ=cd.champion||cd.ally_comp?.[0]||'--';const wp=cd.win_pct;const wpc=!wp?'var(--label)':wp>=60?'var(--green)':wp>=45?'var(--gold)':'var(--red)';el.innerHTML='<h2>GAME STATE - '+(mL[mode]||mode.toUpperCase())+'</h2>'+(champ!=='--'?'<div class="champ-val">'+champ+'</div>':'')+(wp?'<div class="win-bar"><div class="win-fill" style="width:'+Math.min(wp,100)+'%;background:'+wpc+'"></div></div>':'')+'<div class="rows">'+(wp?r('Win%','<span style="color:'+wpc+';font-weight:700">'+wp+'%</span>'):'')+(cd.wave?r('Wave',cd.wave.substring(0,26)):'')+(cd.objective?r('Obj',cd.objective.substring(0,26)):'')+r('Mode',b(mL[mode]||mode.toUpperCase(),mode==='aram'?'p':mode==='arena'?'o':'s'))+'</div>'}
async function doCoach(mode){const el=document.getElementById('c-coach');const d=await get(`${G}/${coachFile(mode)}`);if(!d){el.className='card';el.innerHTML='<h2>COACHING</h2><div style="color:var(--dim)">No data</div>';return}const act=d.action||d.immediate||'IDLE';el.className=/level|buy|sell|roll|fight|engage|back|rotate/i.test(act)?'card warn':'card';const sub1=mode==='tft'?d.econ:d.next||d.wave;const sub2=mode==='tft'?d.risk:d.fight_rule||d.risk;el.innerHTML='<h2>COACHING</h2><div class="action">'+act+'</div><div class="rows">'+(sub1?r(mode==='tft'?'Econ':'Next',sub1.substring(0,32)):'')+(sub2?r(mode==='tft'?'Risk':'Fight',sub2.substring(0,32)):'')+'</div>'}
async function doComp(mode){const el=document.getElementById('c-comp');if(mode==='tft'){const d=await get(`${G}/data/comp_state.json`);if(!d){el.className='card';el.innerHTML='<h2>COMP</h2><div style="color:var(--dim)">--</div>';return}el.className='card';el.innerHTML='<h2>COMP</h2><div class="comp-name">'+(d.selected||'None')+'</div><div class="rows">'+r('Server',d.pbe?b('PBE','y'):b('Live','c'))+r('Route',moonOk?b('MOON-PC','g'):b('LOCAL','c'))+'</div>';return}const d=await get(`${G}/${coachFile(mode)}`);const champ=d?.champion||d?.ally_comp?.[0]||'--';const champColor={sr:'var(--blue)',aram:'var(--purple)',arena:'var(--orange)',brawl:'var(--gold)'}[mode]||'var(--cyan)';el.className='card';el.innerHTML='<h2>CHAMPION</h2><div class="comp-name" style="color:'+champColor+'">'+champ+'</div><div class="rows">'+r('Route',moonOk?b('MOON-PC','g'):b('LOCAL','c'))+r('Mode',b(mode.toUpperCase(),mode==='aram'?'p':mode==='arena'?'o':'s'))+'</div>'}
async function doHealth(){const d=await get(`${G}/ops/runtime/health.json`);const el=document.getElementById('c-health');if(!d){el.className='card alert';el.innerHTML='<h2>APP HEALTH</h2><div class="big err">DOWN</div>';return}const mode=getMode(d);const mL={tft:'TFT',aram:'ARAM',arena:'ARENA',brawl:'BRAWL',sr:'SR',client:'--'}[mode]||mode;el.className=d.alive?'card':'card alert';el.innerHTML='<h2>APP HEALTH</h2><div class="rows">'+r('App',d.alive?b('ALIVE','g'):b('DOWN','r'))+r('Mode',b(d.has_game?mL+' LIVE':'LOBBY',d.has_game?'y':'c'))+r('UI',d.ui_loop_alive?b('OK','g'):b('DEAD','r'))+r('Worker',d.game_poll_worker_alive?b('OK','g'):b('DEAD','r'))+r('PID','<span style="color:var(--label)">'+d.pid+'</span>')+'</div>';return d}
async function doLive(mode){const el=document.getElementById('c-live');if(mode==='client'){const ar=await get(`${G}/data/ratings/last_aram.json`);if(ar&&ar.mode_category==='ARAM'){const gc={S:'#FFD700',A:'#44FF88',B:'#4A9EFF',C:'#D0D0D0',D:'#FF6644',F:'#FF2244'};const gc2=gc[ar.rating]||'#888888';el.className='card live';el.innerHTML='<h2>LAST ARAM</h2><div class="action" style="color:'+gc2+'">'+(ar.rating||'?')+' - '+(ar.label||'')+'</div><div class="rows">'+r('Champ',ar.champion||'?')+r('KDA',ar.stats?.kda||'?')+r('Time',ar.game_time||'?')+r('Mode',b(ar.game_mode==='KIWI'?'MAYHEM':ar.game_mode||'ARAM','p'))+'</div><div style="font-size:10px;color:var(--dim);margin-top:4px;padding:0 8px">'+((ar.notes||[]).slice(0,2).join(' / '))+'</div>';return;}el.className='card';el.innerHTML='<h2>LAST MATCH</h2><div style="color:var(--dim);font-size:11px;margin-top:4px">No ARAM data yet - play a Mayhem game</div>';return;}if(mode==='tft'){const d=await get(`${G}/data/tft_live_data.json`);if(!d){el.className='card';el.innerHTML='<h2>VISION</h2><div style="color:var(--dim)">--</div>';return}const shop=(d.shop_units||[]).filter(u=>u&&u!=='empty'&&u!=='unknown');el.className='card';el.innerHTML='<h2>VISION / TFT</h2><div class="rows">'+r('Route',moonOk?b('MOON-PC','g'):b('LOCAL','c'))+r('Shop',shop.slice(0,3).join(' / ')||'--')+r('Buy',(d.buy||'--').substring(0,28))+r('Traits',(d.traits_active||[]).slice(0,2).join(' / ')||'--')+'</div>';return}const d=await get(`${G}/${coachFile(mode)}`);el.className='card';el.innerHTML='<h2>COACHING / LIVE</h2><div class="rows">'+r('Route',moonOk?b('MOON-PC','g'):b('LOCAL','c'))+(d?.wave?r('Wave',d.wave.substring(0,28)):'')+(d?.objective?r('Obj',d.objective.substring(0,28)):'')+(d?.reset_item?r('Item',d.reset_item.substring(0,28)):'')+(d?.map?r('Map',d.map.substring(0,28)):'')+'</div>'}
async function tick(){document.getElementById('ts').textContent=new Date().toLocaleTimeString('en-US',{hour12:false});await doMoon();const h=await get(`${G}/ops/runtime/health.json`);const mode=getMode(h);const tag=document.getElementById('mode-tag');if(tag)tag.outerHTML=modeTagHtml(mode);await Promise.allSettled([doGame(mode,h),doCoach(mode),doComp(mode),doHealth(),doLive(mode)])}
tick();setInterval(tick,2000);
</script>
</body>
</html>
