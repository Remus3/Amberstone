# rc-shell/electron-builder.yml
#
# Minimal packaging + publish config for the Phase 5 stabilization slice
# (docs/ELECTRON_OVERLAY.md sections 8 + 10). Build with: npx electron-builder
#
# Publish target is GitHub Releases on Remus3/Amberstone. The GitHub repo was
# renamed off Riot's trademark on 2026-08-11 and this slug moved in the SAME
# step, which is the only safe order - electron-updater reads its feed from
# `publish.repo`, so a drift between the two silently breaks auto-update for
# every packaged install. See docs/RENAME_SWEEP_AMBERSTONE.md. The repo is
# public, so a packaged shell reads the release feed without a token; GH_TOKEN
# is needed only on the publishing side (operator-side concern).
# Publishing a Release at all is operator-gated - none exists yet; this file
# only makes the build reproducible when that gate opens.
#
# generateUpdatesFilesForAllChannels emits the per-channel latest*.yml feed
# files so the stable/dev channel split (src/update_channel.js) has a feed
# to read on both channels.

# Riot compliance 2026-08-11: appId changed off the old product-name domain.
# OPERATOR-APPROVED BREAKING CHANGE - Windows treats a new appId as a DIFFERENT
# application, so an existing install will NOT upgrade in place; it co-installs
# alongside and the old one must be uninstalled by hand.
appId: com.amberstone.shell
# Must equal package.json productName (S6: one userData folder for a dev and a
# packaged launch; rc-shell/test/launcher_wiring.test.js pins it).
productName: Amberstone Shell

directories:
  output: dist

files:
  - src/**/*
  - package.json

# PKG-6: the backend ships BESIDE the asar, as real files (Python cannot run
# from inside an asar): resources/backend = the PKG-4 bundle staging
# (tools/build_portable.py -> dist/portable_staging, embedded runtime in
# python-embed/ included). Build it first:
#   python tools/package_portable.py --rebuild-staging   (or build_portable.py)
# main.js resolves resources/backend through rc_root (bundled source) and
# spawns its ops/launcher/service_host.py with python-embed/python.exe.
extraResources:
  - from: ../dist/portable_staging
    to: backend
    filter:
      - "**/*"

win:
  target: nsis
  # S5: an RC-own icon (original geometric drawing, no third-party asset).
  icon: assets/icon.ico

# Start-menu + optional desktop shortcut only. Nothing here (and nothing in
# main.js) registers a start at login or boot: PACKAGING_PLAN intent 3.
nsis:
  oneClick: true
  perMachine: false

publish:
  provider: github
  owner: Remus3
  repo: Amberstone

generateUpdatesFilesForAllChannels: true
