# under it are two dead JavaScript files (the pre-2026-05-18 dashboard copy
# and a 2026-07-07 stub); it holds no Python. The rest is Markdown / text.
#
# tests/** stays analysed (session 118 adjudicator ruling): do not add it.
paths-ignore:
  - docs/_archive/**
