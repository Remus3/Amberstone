# The complement of ci.yml's MINUTE SAVER.
#
# MEASURED 2026-07-27, re-derived 2026-09-06. ci.yml carries
# `paths-ignore: ['**/*.md']` (2026-06-30), so a docs-only commit triggers no
# workflow at all. codspeed.yml carried the same filter and was the second half
# of that sentence until it was deleted on 2026-09-06 (docs/OPERATIONS.md "Why
# CodSpeed was dropped"); one decliner is still one too many to leave unwatched,
# so this workflow's reason to exist is unchanged. But ~48 test modules read tracked .md files off disk and
# assert on their CONTENT, so a .md-only commit can turn a .py guard RED with
# nothing watching. It happened twice in a row:
#
#   b412c2d8  docs-only. Pushed the newest `| R<n> |` row of
#             docs/ORCHESTRATION_PLAN.md past the 16000-byte director-context
#             tail and turned tests/test_loop_director_context_caps.py RED.
#             No CI run.
#   ae829bb2  the docs-only FIX for that. Also no CI run, so the fix's own
#             green was never machine-confirmed.
#
# This workflow fires on exactly what ci.yml declines and runs ONLY the
# md-reading guards. The minute saver survives intact: a prose edit that no
# guard reads still skips the full suite, py_compile sweep, ruff, playwright
# and mypy.
#
# The module list is NOT written here. A hand-maintained universe in YAML is
# green over every module added after it was written (the SCHEDULED_SPAWNERS
# failure). tools/md_guard_selector.py derives it from `git ls-files` at CI
# time, and tests/test_ci_docs_guard_coverage.py re-derives it independently
# and fails if the selector's live output has a gap.

name: docs-guards

on:
  push:
    branches: [main]
    paths:
      - '**/*.md'
      # Edits to the mechanism itself must re-run the mechanism.
      - 'tools/md_guard_selector.py'
      - 'tests/test_ci_docs_guard_coverage.py'
      - 'tools/sanitize_agent6_reports.py'
      - '.github/workflows/docs-guards.yml'
      # Its hashed install set: a Dependabot bump of this file must run the
      # one workflow that installs it, or a bad pin waits for the next docs push.
      - '.github/ci/requirements-docs-guards.txt'
  pull_request:
    branches: [main]
    paths:
      - '**/*.md'
      - 'tools/md_guard_selector.py'
      - 'tests/test_ci_docs_guard_coverage.py'
      - 'tools/sanitize_agent6_reports.py'
      - '.github/workflows/docs-guards.yml'
      - '.github/ci/requirements-docs-guards.txt'
  workflow_dispatch:

# A newer docs push supersedes an in-flight one, same shape as ci.yml.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

# Workflow default stays READ, deliberately, so any job added later inherits
# least privilege. No job is elevated: this workflow writes nothing back.
permissions:
  contents: read

jobs:
  md-guards:
    name: guards that read docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The agent6 audit reports are written by CLOUD SCHEDULED ROUTINES that
    # commit from a fresh clone, where core.hooksPath is unset and
    # tools/precommit_gate.py never fires, so CI is the only gate that sees
    # them (incidents 2026-07-27, 2026-08-04, 2026-08-25). This job used to
    # auto-repair them and push the fix to main under the github-actions bot
    # identity. MAIN's kit-v13 ORDER section 4 (operator authority,
    # 2026-10-08): no workflow pushes to a default branch and no bot commit
    # lands on main. The check below is REPORT-ONLY; the operator lands the
    # one-command repair locally as an operator commit.
    steps:
      # SHA-pinned, tag in the trailing comment (supply-chain order,
      # 2026-10-05); Dependabot's github-actions entry keeps both current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The selector shells out to `git ls-files`, which needs the real
          # index - a fetch-depth of 1 still provides one, but be explicit
          # that this job is git-dependent.
          fetch-depth: 1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/ci/requirements-docs-guards.txt

      - name: Report non-ASCII in cloud-routine audit reports (report-only)
        # Never fails here, so every guard below still runs and reports; the
        # last step of the job fails it when this check found a dirty report.
        id: agent6
        run: |
          set -uo pipefail
          if python tools/sanitize_agent6_reports.py --check; then
            echo "agent6 reports are 7-bit ASCII - nothing to report"
            echo "dirty=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "dirty=true" >> "$GITHUB_OUTPUT"
          echo "::error::non-ASCII in agents/agent6_auditor/reports/ - repair locally: python tools/sanitize_agent6_reports.py --apply, then an operator commit"
          {
            echo "## agent6 audit report carries non-ASCII"
            echo ""
            echo "This workflow is report-only: it never commits or pushes."
            echo "Repair locally, then land it as an operator commit through"
            echo "ops/fleet_kit/fleet_gitlock.py run:"
            echo ""
            echo '```'
            echo "python tools/sanitize_agent6_reports.py --apply"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install minimal test deps (hash-pinned)
        run: |
          # MEASURED 2026-07-27: not one of the 48 currently-selected modules
          # imports the runtime stack (anthropic / PIL / cv2 / websockets /
          # portalocker / json5 / psutil), so this stays deliberately small -
          # this job runs on ~55% of commits. pyyaml is for the workflow-shape
          # assertions in tests/test_ci_docs_guard_coverage.py; without it
          # those degrade to skips, and a skipped test is a green tick - so the
          # import below fails the step instead if the hashed set loses it.
          #
          # HASH-PINNED (supply-chain order, 2026-10-05):
          # .github/ci/requirements-docs-guards.txt is generated from the .in
          # beside it (regeneration command in its header) and installed with
          # --require-hashes. pydantic now follows the runtime pin in
          # requirements.txt instead of floating at ">=2.0". The old
          # `pip install --upgrade pip` line is gone: an unpinned download of
          # the installer itself, and the runner's pip already supports
          # --require-hashes.
          pip install --require-hashes -r .github/ci/requirements-docs-guards.txt
          python -c "import yaml, pytest, pytest_timeout, pytest_asyncio, pydantic"

      - name: Derive the md-reading guard set
        id: select
        run: |
          # Printed to the log so a failure names the exact modules that ran.
          python tools/md_guard_selector.py --explain
          python tools/md_guard_selector.py > /tmp/md_guard_modules.txt
          echo "selected $(wc -l < /tmp/md_guard_modules.txt) module(s)"

      - name: Guards that read tracked .md
        run: |
          # The selector exits 1 on an empty selection, so xargs can never be
          # handed an empty argv and quietly pass.
          xargs -a /tmp/md_guard_modules.txt \
            python -m pytest -q --tb=short --timeout=300 -p no:randomly

      - name: The docs-guard contract itself
        run: |
          # Not selected by the selector (it reads workflow YAML, not .md), so
          # it is named explicitly: it is this workflow's own guard.
          pytest tests/test_ci_docs_guard_coverage.py \
            -q --tb=short --timeout=120 -p no:randomly

      - name: Fail on an unrepaired agent6 report
        if: steps.agent6.outputs.dirty == 'true'
        run: |
          echo "::error::agent6 report non-ASCII is unrepaired (see the first report step and the job summary)"
          exit 1
