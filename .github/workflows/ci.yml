# AUDIT 2026-04-28 (proposal 4.2): CI bare-minimum guard.
# py_compile every .py + run the phase2 smoke + snapshot regression tests.
# Catches drift before it lands on main.

name: ci

on:
  push:
    branches: [main]
    # MINUTE SAVER (2026-06-30): docs-only commits (55% of recent history -
    # the per-session LEDGER/WAKEUP/ORCHESTRATION sync) skip CI entirely.
    # Any non-.md change in the same commit still triggers the full run. The
    # ASCII-hygiene guard that scans .md is backstopped locally by the
    # precommit_gate.py PreToolUse hook (blocks banned glyphs on staged
    # lines), so nothing authored slips past on a docs-only push.
    #
    # CORRECTED 2026-07-27: that backstop only ever covered GLYPHS. ~48 test
    # modules read tracked .md off disk and assert on their CONTENT, and
    # b412c2d8 turned tests/test_loop_director_context_caps.py RED with a
    # docs-only push that ran no CI at all. The complement now lives in
    # .github/workflows/docs-guards.yml, which fires on exactly what this
    # filter declines. Do not remove one without the other - the pairing is
    # pinned by tests/test_ci_docs_guard_coverage.py.
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  schedule:
    - cron: '0 8 * * *'  # Nightly run (paths-ignore does not apply to schedule)
  workflow_dispatch:       # manual trigger to verify the full suite on demand

# MINUTE SAVER (2026-06-30): cancel a superseded in-progress run when a newer
# commit lands on the same ref, so rapid pushes do not each bill to completion.
# event_name is in the group so a push never cancels the nightly schedule run
# (or vice versa) - only same-event runs supersede each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

# CI-ONLY THROWAWAY, and deliberately not a repo secret (2026-09-06).
#
# `f8323887e` untracked config/vision_token.txt, which had been a live 32-hex
# X-RC-Token committed since the repo was created. Right call. But nothing
# replaced it here, and core/vision_token._resolve RAISES rather than
# defaulting - on purpose, so a misconfigured deploy fails loud instead of
# authenticating every request with a known constant. The runner then had
# neither the env var nor the file, so main went red on the next push with 120
# failed / 53 errors, every one of them the same RuntimeError at COLLECTION.
#
# A real secret buys nothing here. This token authenticates 127.0.0.1:8889, a
# LOOPBACK relay that exists only on Legion; no runner ever starts that
# listener. The tests import the resolver, read a value and assert on plumbing,
# so the value's only job on a runner is to be non-empty - _resolve does no
# format validation at all. Putting a real credential into GitHub to satisfy an
# assertion about non-emptiness would add a second place to leak from and fix
# nothing.
#
# Workflow level, not per-job, so a third job added later cannot inherit the
# outage. tests/test_ci_vision_token_env.py pins both halves: that this exists,
# and that it is NOT 32 hex characters - because the tempting "fix" for a
# future red here is to paste the real token back into a tracked file, which is
# exactly the state f8323887e removed, wearing the costume of a bug fix.
env:
  RC_VISION_TOKEN: ci-dummy-not-a-real-token-loopback-only

jobs:
  nightly-full-suite:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # RM-156 (2026-08-04): 60, not 30, and the real ceiling that bites is the
    # step-level one on Full Dual Suite below. This job was NOT the one that
    # blew up - `check` was - but it was measurably closer to its ceiling than
    # `check` was to the 40 that failed: over the last 40 runs its successful
    # wall clock ran 24m13s .. 28m08s against 30, i.e. under two minutes of
    # headroom. Fixing only the job that happened to fail first would have left
    # the identical defect one job up in the same file.
    # RAISED 60 -> 75 on 2026-08-29, together with this job's own Full Dual
    # Suite step (45 -> 55). This job runs the SAME dual suite that timed out
    # on `check` in run 33257192032 at 45m04s, so its 45m step ceiling was the
    # identical latent failure one job up - exactly the "fixing only the job
    # that happened to fail first" mistake the block above warns about. The job
    # ceiling must cover the step PLUS the setup tail, and that tail is not
    # small: RM-156 measured `Install Playwright Chromium` at 10m33s on a cache
    # miss against 27s either side. 55 + an 11m setup tail is 66, so 75 keeps
    # the step-fires-first invariant real rather than nominal.
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v6
        with:
          # FULL history. See the long note on the `check` job's checkout
          # below - this job runs the same `pytest tests/` tree and fails the
          # same 12 ways without it.
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install full runtime + test deps
        run: |
          python -m pip install --upgrade pip
          # The full tree imports the runtime stack (websockets / PIL / portalocker
          # / json5 / anthropic), so the nightly installs requirements.txt - unlike
          # the pure-Python `check` job which runs a minimal ImportError-guarded subset.
          pip install -r requirements.txt
          # pyyaml is test-only (not in requirements.txt) and parses
          # .github/workflows/*.yml for the workflow-contract guards. MEASURED
          # 2026-08-04 (RM-156): without it, tests/test_ci_docs_guard_coverage.py
          # AND tests/test_ci_job_timeout_headroom_rm156.py both degrade to
          # skips in THIS job while the `check` job below runs them for real -
          # so the nightly reported a green tick over assertions it never made.
          pip install pytest pytest-asyncio pytest-timeout pytest-xdist ruff playwright pyyaml
      - name: Install Playwright Chromium
        run: playwright install --with-deps chromium
      - name: Full Dual Suite
        # RM-156: the step ceiling, not the job ceiling, is what should stop a
        # hang here. A step killed by its own timeout is marked FAILED, so the
        # job reports `failure`; a job killed by the job ceiling reports
        # `cancelled`, which is the same word GitHub uses for a run superseded
        # by the concurrency group above. Pinned by
        # tests/test_ci_job_timeout_headroom_rm156.py.
        timeout-minutes: 75
        run: |
          # Runs the exhaustive 23k+ test suite.
          #
          # PARALLEL as of 2026-07-27, and the speedup is REAL LOCALLY AND
          # NEARLY ZERO HERE - measured, because the first version of this
          # comment quoted the local number as if it were the runner's.
          #   local 8-core, -n 8:  20m37s -> 2m20s   (23769 passed, twice)
          #   ubuntu runner, -n auto:  20m37s -> 19m42s   (23607 passed,
          #                            258 skipped, 6032 subtests, 0 failed,
          #                            workflow_dispatch run 30315178736)
          # 55 seconds, about 4 percent. A GitHub runner has 2-4 vCPU, so
          # `-n auto` gets 2-4 workers against 8 locally, and the suite is
          # largely I/O and Playwright bound rather than CPU bound. Keeping the
          # parallel form because it is free and correct, NOT because it made
          # this job fast. Do not quote the 2m20s figure as a CI cost.
          #
          # The blocker that held this back for one commit is fixed, not waived.
          # `-n` used to produce SEVEN failures that did not exist serially, all
          # in tests/preflip_mode/, and the cause was not parallelism: both
          # classes derived unittest.IsolatedAsyncioTestCase, which drives
          # asyncSetUp through asyncio.Runner.run() on the MAIN thread, and
          # Playwright's sync API leaves asyncio's running-loop marker set on
          # that thread for the whole session. So they died in ANY run that also
          # collected snapshot_panels - the serial nightly included - and `-n`
          # merely made a worker draw both files more often. Converted to plain
          # TestCase driving the coroutines through tests/_asyncio_isolation
          # run_coro, assertions unchanged and proven still failing when the
          # production mirror is disabled.
          #
          # --dist loadfile keeps every test in a file on ONE worker, so
          # within-file ordering and file-scoped fixtures still hold; only
          # cross-FILE isolation is newly assumed.
          #
          # A 20-minute job nobody reads is how four real failures sat red here
          # while push CI stayed green (RM-119). It is still a 20-minute job, so
          # the fix for that is NOT the parallel flag - it is that the job is
          # green again and someone has to look at it. And it prices RM-119's
          # remaining half honestly: promoting the full RC tests/ into the push
          # `check` job would cost roughly this, taking that job from ~8m30s to
          # ~20min per push. That is an operator call on minutes, not a free
          # coverage win, and the estimate to beat is measured, not local.
          pytest tests/ agents/daemon_slayer/tests/ -q --tb=short --timeout=300 \
            -n auto --dist loadfile

  check:
    if: github.event_name != 'schedule'

    runs-on: ubuntu-latest
    # 40, not 25, and 25 was not 10. MEASURED 2026-07-27: adding the DS suite
    # (RM-119) pushed this job past a 10-minute budget that had been sized for a
    # 6-minute job, and GitHub CANCELLED it mid-step - which reads as
    # "cancelled", not "failed", so it is easy to misread as a superseded run
    # rather than a timeout.
    #
    # 2026-07-28 (R217-U1, RM-119 second half): this job now runs the FULL dual
    # suite, so the same arithmetic has to be redone rather than inherited. The
    # DS-only shape measured 9m1s end to end (push run 30342574878) and the full
    # dual measured 19m42s of pytest on this runner class (dispatch run
    # 30315178736), so the expected job is ~26 minutes - OVER the old 25 and it
    # would have been cancelled on the first push. 40 is deliberately not 27: a
    # ceiling that sits a minute above the estimate converts ordinary runner
    # variance into a fake red, and the point of a timeout here is to catch a
    # HANG, not to police minutes.
    #
    # RM-156 (2026-08-04): 40 was still too thin, and it was hit - run
    # 30866367283 was killed at 40m16s. The reasoning above was right and the
    # arithmetic under it was wrong, because it sized ONE ceiling against TWO
    # independent tails:
    #   * the SUITE tail. Complete runs of the dual-suite step measured
    #     20m47s .. 27m40s over the last 40 runs. On the killed run that step
    #     had already burned 38m41s when GitHub stopped it, so its true value
    #     is unknown and above that.
    #   * the SETUP tail, which the job ceiling also has to cover and which the
    #     2026-07-28 estimate did not model at all. `Install Playwright
    #     Chromium` took 10m33s on run 30820229244 (cache miss) against 27s on
    #     the runs either side. That run finished in 36m49s - the slowest
    #     SUCCESS on record, and it got there on a normal-length suite.
    # So the job ceiling is now sized as: step ceiling (45) + the worst observed
    # setup (about 11m) + slack. It is not the number that should normally fire.
    #
    # The one that should fire is the step-level `timeout-minutes: 75` on the
    # dual-suite step below, because a step timeout reports `failure` while a
    # job timeout reports `cancelled` - the same conclusion as a concurrency
    # supersede (run 30863180947, 5m19s), so a timed-out branch reads as
    # neither pass nor fail. The ORDERING is the invariant: job must exceed
    # step, or the job dies first and the conclusion is silent again.
    # tests/test_ci_job_timeout_headroom_rm156.py pins all of it.
    #
    # RAISED 65 -> 75 on 2026-08-29 with this job's step ceiling (45 -> 55),
    # after run 33257192032 printed a fully GREEN suite - 29690 passed, 258
    # skipped, 0 failed in 2704.11s - and was killed two seconds later by the
    # 45m step ceiling. The guard requires job >= step + 12, so 55 forces 67 as
    # the floor here; 75 keeps the same variance margin the 65 had.
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v6
        with:
          # FULL history, and it is load-bearing, not defensive.
          #
          # `actions/checkout` defaults to fetch-depth: 1 - a SHALLOW clone
          # with exactly one commit and no history at all. Several guards in
          # `tests/` ask git "was this path once tracked, and when did it stop
          # being tracked", and on a shallow clone git answers "never" for
          # everything. That is not an error, it is a wrong answer, so the
          # guards do not error - they assert the wrong thing and go red.
          #
          # MEASURED 2026-08-07 by cloning this repo at --depth 1 and running
          # the affected modules in the clone:
          #   `git log --all --diff-filter=DR --name-status`
          #       shallow: 0 lines      full: 1344 lines
          #   pytest test_u2500_candidate_sweep.py test_rc2_p73_quarantine.py
          #          test_skip_condition_hygiene.py
          #          test_cost_health_watchdog_glob_rm165.py
          #       shallow clone: 12 failed, 73 passed
          #       full clone:     0 failed, 85 passed
          # Those 12 are exactly 12 of the 13 failures on CI runs 31136741053
          # / 31140950764 / 31144927312 / 31156390386 (the 13th is a
          # filesystem-case issue, fixed in the test itself).
          #
          # The alternative was to make those guards SKIP on a shallow clone.
          # Rejected deliberately: every CI run here is a shallow clone, so
          # the skip would fire on 100 percent of CI runs and on 0 percent of
          # local runs - the guard would report green precisely where it is
          # the only thing watching. tests/test_u2500_candidate_sweep.py and
          # tests/test_rc2_p73_quarantine.py exist in their current form
          # BECAUSE f2f6a0e3 made them skip and cc5525d8 found they had been
          # asserting nothing for months. Re-introducing that shape to dodge a
          # 41MB fetch would undo the fix and hide the next real regression.
          #
          # PRICE, measured on this repo 2026-08-07: .git grows 32.7MB ->
          # 74.1MB (+41.4MB) and 1 commit -> 4695. Local file:// full clone
          # 12.6s; the CI number is a GitHub-side pack fetch and is not this
          # number, but 41MB over the Actions network is seconds, against a
          # job that already budgets 65 minutes.
          #
          # Pinned by tests/test_ci_checkout_history_depth.py: any job in
          # .github/workflows/ that runs the whole `pytest tests/` tree must
          # check out with fetch-depth: 0.
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime + test deps
        run: |
          python -m pip install --upgrade pip
          # requirements.txt, as of 2026-07-28 (R217-U1). This job used to install
          # a deliberately minimal set, on the reasoning that the only tests it
          # ran were pure-Python subsets. That reasoning expired the moment the
          # full RC tests/ tree was promoted onto push below: the tree imports
          # anthropic / PIL / websockets / portalocker / psutil, and an
          # ImportError-guarded test that cannot import is a SKIP, which is a
          # green tick. Installing the real stack is what makes the promotion
          # mean anything - the nightly job has installed it for this exact
          # reason since it was written.
          pip install -r requirements.txt
          # pyyaml parses .github/workflows/*.yml for the docs-guard contract
          # test below, and is NOT in requirements.txt (it is test-only).
          # Without it those assertions degrade to skips.
          # json5 and pydantic ARE in requirements.txt now, so they are no
          # longer pinned here - one source of truth for a version, not two.
          pip install pytest pytest-asyncio pytest-timeout pytest-xdist ruff playwright mypy pyyaml

      # MINUTE SAVER (2026-06-30): cache the Chromium browser binary so only
      # the (fast) --with-deps apt step runs on a hit; the ~120MB download is
      # skipped. `playwright install` stays idempotent - it detects the cached
      # browser and re-downloads only on a Playwright upgrade (refreshing the
      # cache post-job).
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-ms-playwright-v1

      - name: Install Playwright Chromium
        run: playwright install --with-deps chromium

      - name: py_compile sweep
        run: |
          # All .py except legacy/ (kept for archaeology) and __pycache__.
          python - <<'PY'
          import py_compile, sys
          from pathlib import Path
          fails = []
          for p in Path(".").rglob("*.py"):
              parts = p.parts
              if "legacy" in parts or "__pycache__" in parts:
                  continue
              try:
                  py_compile.compile(str(p), doraise=True)
              except Exception as exc:
                  fails.append((p, exc))
          if fails:
              for p, exc in fails:
                  print(f"FAIL: {p}: {exc}", file=sys.stderr)
              sys.exit(1)
          print(f"OK: {sum(1 for _ in Path('.').rglob('*.py'))} .py files compile clean")
          PY

      - name: ruff lint
        run: ruff check .

      - name: DS feed provenance index in sync - a stale row hides a copy-forward
        run: |
          # tools/ds_feed_index.json stores, per shipped patch dir per feed, a
          # content-addressed body hash with every marker / wall-clock / prose
          # key stripped. --check recomputes all of it off disk and exits 1 on
          # any disagreement.
          #
          # What a failure MEANS: the stored provenance no longer describes the
          # bytes on disk. That is not cosmetic. The index is the BASELINE the
          # RM-213 refresh guard compares a new patch dir against
          # (agents/daemon_slayer/abilities.artifact_refresh_verdict), so a
          # stale stored hash makes the next copy-forward compare against the
          # wrong body, read as a legitimate change, and PASS - which is the
          # exact defect the guard was built to catch. A drifted row is also
          # how a hand-edited feed slips in with no re-extract behind it.
          #
          # Runs HERE rather than in docs-guards.yml: that workflow fires only
          # on '**/*.md', and the inputs that move this index are
          # data/daemon_slayer/**/*.json and tools/ds_feed_index.py, so a step
          # there would never fire on a commit that can cause the drift.
          # Pure stdlib and read-only.
          python tools/ds_feed_index.py --check

      - name: authored-source hygiene
        run: |
          # ASCII-hygiene drift guards: no smart quotes / em-en dashes / NBSP /
          # ellipsis / mojibake / U+2500 box-drawing in authored source. The
          # data/daemon_slayer/ feed data is excluded as external data. Catches
          # authored-text drift at PR time so it is never dismissed as
          # "pre-existing / not in CI".
          pytest tests/test_smart_quote_hygiene.py tests/test_mojibake_hygiene.py \
            tests/test_u2500_hygiene.py \
            -q --tb=line --timeout=60
          # PORTED FROM A SIBLING REPO 2026-09-06, credited. The three guards
          # above define their OWN narrower banned set, while
          # tools/precommit_gate.py._glyph_hits is a catch-all over every
          # codepoint > 127 - one CLAUDE.md hard rule with two readings, and the
          # looser one was the one CI ran. This sweeps tracked source through the
          # GATE engine itself, so the hook and CI cannot drift apart.
          #
          # It is a RATCHET, not a flat ban: 50 tracked files carry non-ASCII
          # today and not all are mistakes (web/ ships arrows and status glyphs
          # in rendered UI text). Net-new fails; a cleaned file must leave the
          # baseline in the same commit. It also carries RSC's vacuity guard -
          # a sweep that selects nothing passes while looking identical to a
          # clean tree.
          pytest tests/test_ascii_source_sweep.py \
            -q --tb=short --timeout=120

      - name: docs-guard complement is wired
        run: |
          # MEASURED 2026-07-27: the paths-ignore above means a docs-only push
          # runs NO workflow, yet ~48 test modules read tracked .md off disk and
          # assert on their content. b412c2d8 broke
          # tests/test_loop_director_context_caps.py that way, and ae829bb2 -
          # the docs-only FIX - also ran no CI, so it was never confirmed green.
          #
          # docs-guards.yml is the complement. This step runs HERE - on the
          # non-.md side - because a commit that deletes docs-guards.yml or
          # breaks tools/md_guard_selector.py is by definition not a docs-only
          # commit, so the docs workflow would not fire to defend itself.
          pytest tests/test_ci_docs_guard_coverage.py \
            -q --tb=short --timeout=120

      - name: git hook gate armed and firing
        run: |
          # MEASURED 2026-07-26: all five tracked hooks in .githooks/ were
          # committed mode 100644. Git refuses to run a non-executable hook and
          # reports nothing, so the whole commit-time gate was absent on every
          # Linux clone - this runner included - while CI stayed green. The same
          # day a headless `claude -p --permission-mode bypassPermissions` run
          # committed a banned em-dash through the hole.
          #
          # It survived that long because CI could not see it: the live-repo hook
          # assertions in tests/test_drift_guard.py skip when core.hooksPath is
          # unset, which it always is on a fresh clone, and a skipped test is a
          # green tick. So this step ARMS the gate first, then asserts it with
          # RC_REQUIRE_HOOK_GATE=1, which turns "unconfigured clone" from a skip
          # into a failure. tests/test_git_hook_gate_e2e.py then makes real
          # commits into a temp repo, because a hook's PRESENCE has never been
          # proof that it fires.
          #
          # The mode assertion is deliberately direct rather than inferred from a
          # downstream symptom: 100644 is the specific regression that started
          # all of this, and it deserves to be named.
          python scripts/install_hooks.py
          test "$(git ls-files .githooks/ | wc -l)" -ge 5 || {
            echo "expected at least 5 tracked hooks in .githooks/"; exit 1; }
          if git ls-files -s .githooks/ | grep -v '^100755 '; then
            echo "the hook(s) above are not mode 100755 - git will silently refuse"
            echo "to run them. Fix with: git update-index --chmod=+x <hook>"
            exit 1
          fi
          RC_REQUIRE_HOOK_GATE=1 pytest \
            tests/test_drift_guard.py::GitHooksPathTests \
            tests/test_drift_guard.py::OrphanedHookTests \
            tests/test_drift_guard.py::HookGateRequirementTests \
            tests/test_git_hook_gate_e2e.py \
            -q --tb=short --timeout=120

      - name: shipped build-order tables asserted, not skipped
        run: |
          # MEASURED 2026-07-26 (skip audit): seven guards over the shipped HZ
          # precompute tables - schema version, comp-archetype taxonomy,
          # per-champion completeness, canonical-vs-display keyspace, the
          # anti-tank pivot, ASCII hygiene - were written as
          # `if not load_...(): skipTest(...)`. Those loaders are fail-soft to
          # `{}` on ANY missing-or-parse error, so an absent table and a CORRUPT
          # one were the same value at the skip site, and all seven fell silent
          # at exactly the moment they matter: a patch bump, when the tables are
          # regenerated. The tables feed the live dashboard build-order panel.
          #
          # Every table is TRACKED (git ls-files data/daemon_slayer/build_orders/
          # <patch>/), so this runner has them and has no excuse to skip.
          # RC_REQUIRE_BUILD_ORDER_TABLES=1 turns "not generated yet" from a
          # skip into a failure here, the same shape as RC_REQUIRE_HOOK_GATE
          # above. Pure-Python plus pydantic, already installed.
          RC_REQUIRE_BUILD_ORDER_TABLES=1 pytest \
            tests/test_build_order_precompute.py \
            tests/test_build_order_variants.py \
            tests/test_hz_precompute_canonical_keyspace.py \
            tests/test_build_order_axis_parity.py \
            -q --tb=short --timeout=120

      # RM-407 (2026-09-11). The step below wires ONE of the repo's two ORPHAN
      # test trees; the other is BLOCKED on a measured flake and is declared as
      # an exception in the guard - see the comment further down.
      # Until this commit `agents/agent3_testing/suite` and
      # `tools/tests` were named by NO pytest invocation in this file - not by
      # the push `check` job, not by nightly-full-suite - so 359 + 348 tracked,
      # collecting, passing tests had never gated a push, a pull request or a
      # nightly. That is the same zero-signal shape RM-119 found for the Daemon
      # Slayer tree, and it was found by hand both times.
      # `tests/test_ci_collects_orphan_suite_trees.py` is what makes the third
      # instance impossible: it joins the git-index enumeration of test trees to
      # a parse of THIS file, so deleting either step below reds that guard
      # instead of silently un-gating a tree.
      #
      # ONE STEP PER TREE, EACH ITS OWN PROCESS, and that is load-bearing rather
      # than tidy. The dual-suite step below hosts `tests/snapshot_panels`,
      # which drives Playwright's SYNC api; that leaves asyncio's per-thread
      # running-loop marker set on the main thread for the remainder of the
      # session. `agents/agent3_testing/suite` drives its loop bodies with bare
      # `asyncio.run()`, which raises "cannot be called from a running event
      # loop" whenever that marker is set - which is exactly why that tree ships
      # an autouse conftest fixture clearing the marker (s236). A separate
      # interpreter is the total fix. Do NOT fold either tree into the
      # dual-suite invocation.
      #
      # THE COLLECTED-COUNT ASSERTION COMES FIRST, and it is the point of the
      # step rather than belt-and-braces. A path list that reaches pytest
      # malformed makes it print "no tests ran" and exit 0 - measured at the
      # RM-405 wrap, where a CRLF-carrying path list did exactly that - so a
      # bare `pytest <tree>` step can be green having collected nothing, which
      # is the defect these steps exist to end, reintroduced one layer down.
      # `agents/agent3_testing/suite` IS NOT WIRED, and that is a measured
      # verdict rather than an omission. An independent verifier ran its
      # post-exclusion set three times: run 1 returned 1 failed / 348 passed -
      # `test_supervisor.py::test_supervisor_starts_and_binds_ports`, "lockfile
      # heartbeat never refreshed to a second value" - while runs 2 and 3 were
      # green and the test passes 3/3 in isolation. A 1-in-3 load-dependent
      # flake in a push-blocking job manufactures fake reds, and a fake red is
      # worse than the zero signal it would replace. Behind it sit 7 tests
      # gated on a live supervisor at 127.0.0.1:8890 and a `test_scheduler_lock`
      # comment stating CI does not run this suite. The exception is DECLARED
      # in `tests/test_ci_collects_orphan_suite_trees.py::_COLLECTION_ROOTS`
      # with that mechanism, so this tree cannot be forgotten: adding a step
      # for it here without flipping that row reds the guard, and so does
      # deleting the row. Wiring it needs the flake fixed at source.

      # No conftest.py of its own, and it does not need one: all nine modules
      # under tools/tests carry their own `sys.path.insert(_TOOLS)` derived from
      # __file__, so the imports resolve the same on a clean Linux runner as
      # they do on Legion. Third-party reach is json5 via the extractors it
      # imports, and that arrives with requirements.txt above.
      - name: "orphan tree gated: tools/tests (RM-407)"
        timeout-minutes: 10
        run: |
          python -c "import subprocess,sys; t='tools/tests'; p=subprocess.run([sys.executable,'-m','pytest',t,'--collect-only','-q'],capture_output=True,text=True); n=sum(1 for line in p.stdout.splitlines() if '::' in line); print(p.stdout[-2000:]); print('RM-407 collected nodeids under '+t+': '+str(n)); sys.exit(0 if p.returncode==0 and n>0 else 1)"
          pytest tools/tests -q --tb=short --timeout=300

      # The extracted `oss/win32_atomic_io` package. Its own suite, its own
      # process, same collected-count assertion first for the same reason: a
      # path list that reaches pytest malformed prints "no tests ran" and exits
      # 0, so a bare `pytest <tree>` step can be green having collected nothing.
      # It needs nothing from requirements.txt - the package is stdlib-only and
      # the tests use `tmp_path` exclusively, so this step is safe to run on a
      # clean runner. Its `tests/conftest.py` puts the src-layout package on
      # sys.path, so no install step is required.
      - name: "orphan tree gated: oss/win32_atomic_io/tests"
        timeout-minutes: 10
        run: |
          python -c "import subprocess,sys; t='oss/win32_atomic_io/tests'; p=subprocess.run([sys.executable,'-m','pytest',t,'--collect-only','-q'],capture_output=True,text=True); n=sum(1 for line in p.stdout.splitlines() if '::' in line); print(p.stdout[-2000:]); print('collected nodeids under '+t+': '+str(n)); sys.exit(0 if p.returncode==0 and n>0 else 1)"
          pytest oss/win32_atomic_io/tests -q --tb=short --timeout=300

      - name: "full dual suite (RM-119 - push CI now gates the whole tree)"
        # RM-156: this is the ceiling that should fire, not the job's. See the
        # block above `timeout-minutes: 95` for the measurement; the short
        # version is that a step timeout reports `failure` and a job timeout
        # reports `cancelled`, and `cancelled` is unreadable because a
        # superseded run says the same thing.
        #
        # RAISED 45 -> 55 on 2026-08-29, and the mechanism above is exactly why
        # this was visible at all. Run 33257192032 printed
        # `29690 passed, 258 skipped, 0 failed in 2704.11s (0:45:04)` and was
        # then killed TWO SECONDS later by the 45m ceiling, so a fully GREEN
        # suite reported as a red step. The suite had simply outgrown its
        # budget: the baseline recorded below was 19m42s / 23607 passed, and it
        # is now 45m04s / 29690 passed - 26 percent more tests for well over
        # twice the wall clock. 55 is deliberately not 46: RM-156's own finding
        # is that a ceiling hugging the worst complete observation converts
        # ordinary runner variance into a fake red.
        timeout-minutes: 75
        run: |
          # 2026-07-28 (R217-U1) completes RM-119. Until this step, push CI ran
          # four hand-picked subsets of tests/ - phase2_smoke,
          # snapshot_regressions, phase8_smoke, fu02_team_context,
          # snapshot_panels - plus the DS tree. Everything else in tests/ was
          # ungated on push and gated only by nightly-full-suite, which is
          # `schedule || workflow_dispatch` and therefore blocks NOTHING. That
          # is how four real failures sat red in the nightly while push CI
          # stayed green. The subset steps are gone rather than kept alongside
          # this one: they are pure subsets of `tests/` now, and a second run of
          # the same file buys minutes, not signal.
          #
          # PRICE, measured on this runner class and not on the 8-core local box:
          # 19m42s / 23607 passed / 258 skipped / 6032 subtests / 0 failed
          # (workflow_dispatch run 30315178736). `-n auto` buys about 4 percent
          # here - a runner has 2-4 vCPU and the suite is I/O and Playwright
          # bound - so do NOT quote the ~2m20s local `-n 8` number as a CI cost.
          # timeout-minutes at the top of this job was raised to match.
          #
          # --dist loadfile keeps every test in a file on ONE worker, so
          # within-file ordering and file-scoped fixtures still hold; only
          # cross-FILE isolation is newly assumed.
          #
          # The steps ABOVE that still name individual test files are not
          # redundant with this one and must not be folded into it: two of them
          # set RC_REQUIRE_HOOK_GATE / RC_REQUIRE_BUILD_ORDER_TABLES, which turn
          # a skip into a failure, and the rest are seconds-long fast-fail
          # guards that report an ASCII or docs-guard break in the first minute
          # instead of the twentieth.
          #
          # MEASURED 2026-07-27 (RM-119). This repo has 397 Daemon Slayer test
          # files and NOT ONE of them ran on a push or a pull request. They ran
          # only under nightly-full-suite, which is gated on `schedule ||
          # workflow_dispatch` and therefore blocks nothing - so a DS regression
          # merged green and surfaced, at best, the next morning in a job with
          # no gating power. DS is the engine behind every build recommendation
          # the live dashboard serves, which makes it the worst possible half of
          # the tree to leave ungated.
          #
          # It is cheap, which is why this is the first half of RM-119 to land:
          # 10053 passed / 5585 subtests in 44s at `-n 8` on an 8-core local
          # box. `-n auto` HERE, not `-n 8`: a GitHub runner has 2-4 vCPU, so a
          # hardcoded 8 oversubscribes it and runs SLOWER than the local number
          # suggests - which is how the first attempt at this step blew the
          # job's 10-minute budget and was cancelled mid-run.
          #
          # DEPENDENCIES, corrected after CI proved the first claim wrong. The
          # DS package itself imports nothing from the runtime stack, but its
          # TESTS reach outside it: they import 6 modules from core/ and tools/,
          # and tools/daemon_slayer_{extract,abilities_extract}.py import json5,
          # so the step failed with ModuleNotFoundError until json5 was added
          # above. The original claim came from a grep over
          # `agents/daemon_slayer/*.py`, which does NOT recurse and does not see
          # what the tests import - enumerate the transitive set, not the glob.
          # Re-checked exhaustively: across all 6 of those modules json5 is the
          # only third-party import - and as of R217-U1 that install comes from
          # requirements.txt rather than a second pin in this file.
          #
          # It was NOT cheap a day ago, and the reason is worth recording: the
          # identical command returned 11 failures that morning. They were not
          # 11 problems and not flakiness - they were one defect, a
          # ThreadingHTTPServer left at socketserver's default
          # request_queue_size of 5, so concurrent load got connections REFUSED
          # and `core/daemon_slayer_client.py` mapped the transport error to
          # None, which callers read as an engine verdict. Fixed at source in
          # 95cded3b. Any future "the DS tests are flaky under -n" claim should
          # be re-measured before it is believed.
          pytest tests/ agents/daemon_slayer/tests/ -q --tb=short --timeout=300 \
            -n auto --dist loadfile

      - name: mypy gradual typing
        continue-on-error: true
        run: mypy
