# AUDIT 2026-04-28 (proposal 4.2): CI bare-minimum guard.
# py_compile every .py + run the phase2 smoke + snapshot regression tests.
# Catches drift before it lands on main.

name: ci

on:
  push:
    branches: [main]
    # MINUTE SAVER (2026-06-30): docs-only commits (55% of recent history -
    # the per-session LEDGER/WAKEUP/ORCHESTRATION sync) skip CI entirely.
    # Any non-.md change in the same commit still triggers the full run. The
    # ASCII-hygiene guard that scans .md is backstopped locally by the
    # precommit_gate.py PreToolUse hook (blocks banned glyphs on staged
    # lines), so nothing authored slips past on a docs-only push.
    #
    # CORRECTED 2026-07-27: that backstop only ever covered GLYPHS. ~48 test
    # modules read tracked .md off disk and assert on their CONTENT, and
    # 6bad3814 turned tests/test_loop_director_context_caps.py RED with a
    # docs-only push that ran no CI at all. The complement now lives in
    # .github/workflows/docs-guards.yml, which fires on exactly what this
    # filter declines. Do not remove one without the other - the pairing is
    # pinned by tests/test_ci_docs_guard_coverage.py.
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  schedule:
    - cron: '0 8 * * *'  # Nightly run (paths-ignore does not apply to schedule)
  workflow_dispatch:       # manual trigger to verify the full suite on demand

# MINUTE SAVER (2026-06-30): cancel a superseded in-progress run when a newer
# commit lands on the same ref, so rapid pushes do not each bill to completion.
# event_name is in the group so a push never cancels the nightly schedule run
# (or vice versa) - only same-event runs supersede each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  nightly-full-suite:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install full runtime + test deps
        run: |
          python -m pip install --upgrade pip
          # The full tree imports the runtime stack (websockets / PIL / portalocker
          # / json5 / anthropic), so the nightly installs requirements.txt - unlike
          # the pure-Python `check` job which runs a minimal ImportError-guarded subset.
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-timeout ruff playwright
      - name: Install Playwright Chromium
        run: playwright install --with-deps chromium
      - name: Full Dual Suite
        run: |
          # Runs the exhaustive 14k+ test suite.
          pytest tests/ agents/daemon_slayer/tests/ -q --tb=short --timeout=120

  check:
    if: github.event_name != 'schedule'

    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install minimal test deps
        run: |
          python -m pip install --upgrade pip
          # Test runner + linter only - RC's runtime stack (anthropic/PIL/pytesseract)
          # is intentionally not installed; tests that import it must guard
          # for ImportError or be marked phase2_smoke / snapshot_regressions
          # which are pure-Python.
          # pyyaml parses .github/workflows/*.yml for the docs-guard contract
          # test below. Without it those assertions degrade to skips, and a
          # skipped test is a green tick.
          pip install pytest pytest-asyncio pytest-timeout ruff pydantic>=2.0 playwright mypy pyyaml

      # MINUTE SAVER (2026-06-30): cache the Chromium browser binary so only
      # the (fast) --with-deps apt step runs on a hit; the ~120MB download is
      # skipped. `playwright install` stays idempotent - it detects the cached
      # browser and re-downloads only on a Playwright upgrade (refreshing the
      # cache post-job).
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-ms-playwright-v1

      - name: Install Playwright Chromium
        run: playwright install --with-deps chromium

      - name: py_compile sweep
        run: |
          # All .py except legacy/ (kept for archaeology) and __pycache__.
          python - <<'PY'
          import py_compile, sys
          from pathlib import Path
          fails = []
          for p in Path(".").rglob("*.py"):
              parts = p.parts
              if "legacy" in parts or "__pycache__" in parts:
                  continue
              try:
                  py_compile.compile(str(p), doraise=True)
              except Exception as exc:
                  fails.append((p, exc))
          if fails:
              for p, exc in fails:
                  print(f"FAIL: {p}: {exc}", file=sys.stderr)
              sys.exit(1)
          print(f"OK: {sum(1 for _ in Path('.').rglob('*.py'))} .py files compile clean")
          PY

      - name: ruff lint
        run: ruff check .

      - name: DS Share package in sync
        run: |
          # The Share/ external-review package mirrors the live DS engine.
          # --check re-derives the deterministic Share/src mirror and exits 1
          # if it drifts from the live engine - so any DS change that forgot
          # to re-sync (python tools/ds_share_sync.py) fails here. Pure stdlib.
          python tools/ds_share_sync.py --check

      - name: authored-source hygiene
        run: |
          # ASCII-hygiene drift guards: no smart quotes / em-en dashes / NBSP /
          # ellipsis / mojibake / U+2500 box-drawing in authored source. The
          # Share/src DS data mirror is excluded as external data (same as the
          # data/daemon_slayer/ source it mirrors). Catches authored-text drift
          # at PR time so it is never dismissed as "pre-existing / not in CI".
          pytest tests/test_smart_quote_hygiene.py tests/test_mojibake_hygiene.py \
            tests/test_u2500_hygiene.py \
            -q --tb=line --timeout=60

      - name: docs-guard complement is wired
        run: |
          # MEASURED 2026-07-27: the paths-ignore above means a docs-only push
          # runs NO workflow, yet ~48 test modules read tracked .md off disk and
          # assert on their content. 6bad3814 broke
          # tests/test_loop_director_context_caps.py that way, and 8d22734b -
          # the docs-only FIX - also ran no CI, so it was never confirmed green.
          #
          # docs-guards.yml is the complement. This step runs HERE - on the
          # non-.md side - because a commit that deletes docs-guards.yml or
          # breaks tools/md_guard_selector.py is by definition not a docs-only
          # commit, so the docs workflow would not fire to defend itself.
          pytest tests/test_ci_docs_guard_coverage.py \
            -q --tb=short --timeout=120

      - name: git hook gate armed and firing
        run: |
          # MEASURED 2026-07-26: all five tracked hooks in .githooks/ were
          # committed mode 100644. Git refuses to run a non-executable hook and
          # reports nothing, so the whole commit-time gate was absent on every
          # Linux clone - this runner included - while CI stayed green. The same
          # day a headless `claude -p --permission-mode bypassPermissions` run
          # committed a banned em-dash through the hole.
          #
          # It survived that long because CI could not see it: the live-repo hook
          # assertions in tests/test_drift_guard.py skip when core.hooksPath is
          # unset, which it always is on a fresh clone, and a skipped test is a
          # green tick. So this step ARMS the gate first, then asserts it with
          # RC_REQUIRE_HOOK_GATE=1, which turns "unconfigured clone" from a skip
          # into a failure. tests/test_git_hook_gate_e2e.py then makes real
          # commits into a temp repo, because a hook's PRESENCE has never been
          # proof that it fires.
          #
          # The mode assertion is deliberately direct rather than inferred from a
          # downstream symptom: 100644 is the specific regression that started
          # all of this, and it deserves to be named.
          python scripts/install_hooks.py
          test "$(git ls-files .githooks/ | wc -l)" -ge 5 || {
            echo "expected at least 5 tracked hooks in .githooks/"; exit 1; }
          if git ls-files -s .githooks/ | grep -v '^100755 '; then
            echo "the hook(s) above are not mode 100755 - git will silently refuse"
            echo "to run them. Fix with: git update-index --chmod=+x <hook>"
            exit 1
          fi
          RC_REQUIRE_HOOK_GATE=1 pytest \
            tests/test_drift_guard.py::GitHooksPathTests \
            tests/test_drift_guard.py::OrphanedHookTests \
            tests/test_drift_guard.py::HookGateRequirementTests \
            tests/test_git_hook_gate_e2e.py \
            -q --tb=short --timeout=120

      - name: shipped build-order tables asserted, not skipped
        run: |
          # MEASURED 2026-07-26 (skip audit): seven guards over the shipped HZ
          # precompute tables - schema version, comp-archetype taxonomy,
          # per-champion completeness, canonical-vs-display keyspace, the
          # anti-tank pivot, ASCII hygiene - were written as
          # `if not load_...(): skipTest(...)`. Those loaders are fail-soft to
          # `{}` on ANY missing-or-parse error, so an absent table and a CORRUPT
          # one were the same value at the skip site, and all seven fell silent
          # at exactly the moment they matter: a patch bump, when the tables are
          # regenerated. The tables feed the live dashboard build-order panel.
          #
          # Every table is TRACKED (git ls-files data/daemon_slayer/build_orders/
          # <patch>/), so this runner has them and has no excuse to skip.
          # RC_REQUIRE_BUILD_ORDER_TABLES=1 turns "not generated yet" from a
          # skip into a failure here, the same shape as RC_REQUIRE_HOOK_GATE
          # above. Pure-Python plus pydantic, already installed.
          RC_REQUIRE_BUILD_ORDER_TABLES=1 pytest \
            tests/test_build_order_precompute.py \
            tests/test_build_order_variants.py \
            tests/test_hz_precompute_canonical_keyspace.py \
            tests/test_build_order_axis_parity.py \
            -q --tb=short --timeout=120

      - name: smoke + regression tests
        run: |
          pytest tests/phase2_smoke tests/snapshot_regressions tests/phase8_smoke \
            tests/fu02_team_context \
            -q --tb=line --timeout=60

      - name: panel snapshot tests
        run: |
          pytest tests/snapshot_panels/ -q --tb=short --timeout=60

      - name: mypy gradual typing
        continue-on-error: true
        run: mypy
