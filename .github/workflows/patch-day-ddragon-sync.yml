name: patch-day-ddragon-sync

on:
  schedule:
    # Run hourly on patch days (these specific dates)
    # Note: GitHub Actions runs in UTC. Midnight PT varies by DST:
    # - PDT (UTC-7): midnight PT = 07:00 UTC
    # - PST (UTC-8): midnight PT = 08:00 UTC
    # We run hourly on these dates to ensure coverage.
    - cron: '7 * * * *'  # Every hour at :07 (avoiding :00 congestion)
  workflow_dispatch:     # Manual trigger for testing

# REPORT-ONLY (MAIN kit-v13 ORDER section 4, operator authority, 2026-10-08):
# no workflow pushes to a default branch, because a runner commit is a bot
# commit. This lane used to commit the refreshed DDragon data and push it to
# main under a non-operator identity; it now only REPORTS what changed (job
# summary + a warning annotation) and the operator lands the refresh locally
# as an operator commit. It deliberately does NOT fail on a pending refresh:
# a red scheduled run on main would be picked up by the CI watchdog as a CI
# failure to auto-fix. `cancel-in-progress: false` keeps an hourly run from
# being cut off mid-download; overlapping runs no longer race on a push.
concurrency:
  group: patch-day-ddragon-sync
  cancel-in-progress: false

# Least privilege (supply-chain order, 2026-10-05). The workflow default is
# READ, so any job added later inherits nothing it did not ask for.
permissions:
  contents: read

jobs:
  patch-day-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # No elevation: the job inherits the workflow's read-only token. It writes
    # nothing back to the repository (report-only, see the header above).

    steps:
      # SHA-pinned, tag in the trailing comment (supply-chain order,
      # 2026-10-05); Dependabot's github-actions entry keeps both current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Check if today is a patch day
        id: patch_day
        run: |
          PATCH_DAYS="2026-09-10 2026-09-23 2026-10-07 2026-10-21 2026-11-04 2026-11-18 2026-12-09"
          TODAY=$(date -u +%Y-%m-%d)

          if echo "$PATCH_DAYS" | grep -q "$TODAY"; then
            echo "is_patch_day=true" >> $GITHUB_OUTPUT
            echo "✓ Today is a patch day: $TODAY"
          else
            echo "is_patch_day=false" >> $GITHUB_OUTPUT
            echo "→ Not a patch day (today: $TODAY)"
            exit 0
          fi

      - name: Check Riot patch schedule (hourly until success)
        if: steps.patch_day.outputs.is_patch_day == 'true'
        id: patch_check
        run: |
          echo "Checking Riot Games patch schedule..."
          TIMEOUT=10
          START=$(date +%s)

          while true; do
            RESPONSE=$(curl -s -w "\n%{http_code}" \
              https://support.riotgames.com/en-us/league-of-legends/gameplay/patch-schedule-league-of-legends/)

            HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
            BODY=$(echo "$RESPONSE" | head -n-1)

            if [ "$HTTP_CODE" = "200" ] && echo "$BODY" | grep -q "patch"; then
              echo "✓ Patch schedule is accessible and has updated content"
              echo "schedule_success=true" >> $GITHUB_OUTPUT
              break
            else
              ELAPSED=$(($(date +%s) - START))
              echo "✗ Patch schedule check failed (HTTP $HTTP_CODE, elapsed ${ELAPSED}s)"

              if [ $ELAPSED -ge $TIMEOUT ]; then
                echo "schedule_success=false" >> $GITHUB_OUTPUT
                exit 1
              fi

              sleep 30
            fi
          done

      - name: Download DDragon items (once patch schedule succeeds)
        if: steps.patch_check.outputs.schedule_success == 'true'
        run: |
          echo "Downloading latest DDragon items..."
          python scripts/audit_ddragon_items.py --download

      - name: Run data pipeline items index
        if: steps.patch_check.outputs.schedule_success == 'true'
        run: |
          echo "Running data pipeline items index..."
          python scripts/data_pipeline.py items_index

      - name: Report data updates (report-only, no commit, no push)
        if: steps.patch_check.outputs.schedule_success == 'true'
        run: |
          # STAGE FIRST, THEN DECIDE, so the question and the population agree:
          # only the two generated globs count, never an unrelated dirty file.
          # Staging here only scopes the diff on the runner; nothing is committed.
          git add data/meta/ddragon_*.json web/data/*_index.json

          if git diff --cached --quiet; then
            echo "-> No ddragon data changes, nothing to report"
            exit 0
          fi

          echo "::warning::patch-day DDragon refresh is pending - land it locally as an operator commit (see the job summary)"
          {
            echo "## Patch-day DDragon refresh pending"
            echo ""
            echo "This lane is report-only: it never commits or pushes to main."
            echo "Land the refresh locally as an operator commit:"
            echo ""
            echo '```'
            echo "python scripts/audit_ddragon_items.py --download"
            echo "python scripts/data_pipeline.py items_index"
            echo '```'
            echo ""
            echo "then stage data/meta/ddragon_*.json and web/data/*_index.json and"
            echo "commit + push them through ops/fleet_kit/fleet_gitlock.py run."
            echo ""
            echo "Changed on the runner:"
            echo ""
            echo '```'
            git diff --cached --stat
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          git diff --cached --stat

      - name: Report status
        if: always()
        run: |
          if [ "${{ steps.patch_day.outputs.is_patch_day }}" = "true" ]; then
            if [ "${{ steps.patch_check.outputs.schedule_success }}" = "true" ]; then
              echo "✓ Patch day sync completed successfully"
            else
              echo "✗ Patch schedule check did not complete within timeout"
              exit 1
            fi
          fi
