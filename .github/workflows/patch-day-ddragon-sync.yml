name: patch-day-ddragon-sync

on:
  schedule:
    # Run hourly on patch days (these specific dates)
    # Note: GitHub Actions runs in UTC. Midnight PT varies by DST:
    # - PDT (UTC-7): midnight PT = 07:00 UTC
    # - PST (UTC-8): midnight PT = 08:00 UTC
    # We run hourly on these dates to ensure coverage.
    - cron: '7 * * * *'  # Every hour at :07 (avoiding :00 congestion)
  workflow_dispatch:     # Manual trigger for testing

# This lane fires HOURLY and it COMMITS AND PUSHES to main, so it is the one
# workflow in the repo where an overlap is not merely wasted queue time. Two runs
# that both stage the same generated files, commit and push will race, and the
# loser's push is rejected. `cancel-in-progress: false` is deliberate: queueing is
# correct here, because cancelling a run part-way through a commit-and-push is
# worse than making it wait. ci.yml and docs-guards.yml use `true` because
# cancelling a superseded TEST run costs nothing.
concurrency:
  group: patch-day-ddragon-sync
  cancel-in-progress: false

# Least privilege (supply-chain order, 2026-10-05). The workflow default is
# READ, so any job added later inherits nothing it did not ask for.
permissions:
  contents: read

jobs:
  patch-day-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The ONE elevation in this file, at job level: the "Commit and push data
    # updates" step below commits the refreshed DDragon data and runs
    # `git push origin main` with the workflow token, which needs
    # contents: write. Nothing else in the job writes, and no other scope is
    # granted.
    permissions:
      contents: write

    steps:
      # SHA-pinned, tag in the trailing comment (supply-chain order,
      # 2026-10-05); Dependabot's github-actions entry keeps both current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Check if today is a patch day
        id: patch_day
        run: |
          PATCH_DAYS="2026-09-10 2026-09-23 2026-10-07 2026-10-21 2026-11-04 2026-11-18 2026-12-09"
          TODAY=$(date -u +%Y-%m-%d)

          if echo "$PATCH_DAYS" | grep -q "$TODAY"; then
            echo "is_patch_day=true" >> $GITHUB_OUTPUT
            echo "✓ Today is a patch day: $TODAY"
          else
            echo "is_patch_day=false" >> $GITHUB_OUTPUT
            echo "→ Not a patch day (today: $TODAY)"
            exit 0
          fi

      - name: Check Riot patch schedule (hourly until success)
        if: steps.patch_day.outputs.is_patch_day == 'true'
        id: patch_check
        run: |
          echo "Checking Riot Games patch schedule..."
          TIMEOUT=10
          START=$(date +%s)

          while true; do
            RESPONSE=$(curl -s -w "\n%{http_code}" \
              https://support.riotgames.com/en-us/league-of-legends/gameplay/patch-schedule-league-of-legends/)

            HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
            BODY=$(echo "$RESPONSE" | head -n-1)

            if [ "$HTTP_CODE" = "200" ] && echo "$BODY" | grep -q "patch"; then
              echo "✓ Patch schedule is accessible and has updated content"
              echo "schedule_success=true" >> $GITHUB_OUTPUT
              break
            else
              ELAPSED=$(($(date +%s) - START))
              echo "✗ Patch schedule check failed (HTTP $HTTP_CODE, elapsed ${ELAPSED}s)"

              if [ $ELAPSED -ge $TIMEOUT ]; then
                echo "schedule_success=false" >> $GITHUB_OUTPUT
                exit 1
              fi

              sleep 30
            fi
          done

      - name: Download DDragon items (once patch schedule succeeds)
        if: steps.patch_check.outputs.schedule_success == 'true'
        run: |
          echo "Downloading latest DDragon items..."
          python scripts/audit_ddragon_items.py --download

      - name: Run data pipeline items index
        if: steps.patch_check.outputs.schedule_success == 'true'
        run: |
          echo "Running data pipeline items index..."
          python scripts/data_pipeline.py items_index

      - name: Commit and push data updates
        if: steps.patch_check.outputs.schedule_success == 'true'
        run: |
          git config user.email "patch-day-sync@anthropic-routines"
          git config user.name "patch-day-sync"

          # STAGE FIRST, THEN DECIDE. The previous order asked `git diff` about the
          # WHOLE tree and then staged only two globs, so any unrelated dirty file
          # sent it into the commit branch with nothing staged. That is why the
          # commit needed `|| true` to stay green - the guard and the action were
          # asking about different populations. Staging first makes them agree.
          git add data/meta/ddragon_*.json web/data/*_index.json

          if git diff --cached --quiet; then
            echo "-> No ddragon data changes staged, nothing to commit"
            exit 0
          fi

          git commit -m "chore(ddragon): patch-day sync - $(date -u +%Y-%m-%d)"

          # A push failure HERE cannot be "no changes" - we just committed one.
          # The previous `|| echo "Push failed or no changes"` made a genuinely
          # rejected push indistinguishable from a benign no-op, so a lane that
          # silently stopped publishing data would have looked green forever. Fail
          # loudly instead; the concurrency group above removes the self-race that
          # was the most likely cause of a rejection.
          if git push origin main; then
            echo "-> pushed the patch-day sync to main"
          else
            echo "::error::patch-day sync COMMITTED but FAILED to push to main."
            echo "::error::The commit exists only on the runner. Re-run this lane."
            exit 1
          fi

      - name: Report status
        if: always()
        run: |
          if [ "${{ steps.patch_day.outputs.is_patch_day }}" = "true" ]; then
            if [ "${{ steps.patch_check.outputs.schedule_success }}" = "true" ]; then
              echo "✓ Patch day sync completed successfully"
            else
              echo "✗ Patch schedule check did not complete within timeout"
              exit 1
            fi
          fi
