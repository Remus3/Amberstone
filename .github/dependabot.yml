# Dependabot version updates (supply-chain order, 2026-10-05, item 2.1).
#
# One `updates` entry per ecosystem actually present in this tree, weekly, and
# ONE group per ecosystem so a week is at most one PR per ecosystem, not a
# burst. Nothing here auto-merges, and a Dependabot PR is NEVER merged on
# GitHub in any mode (MAIN kit-v13/v14 ORDER section 4: a squash keeps the bot
# as author, a web merge writes a non-operator committer). Once its gating CI
# (ci.yml) is green, the bump is applied LOCALLY as an operator commit
# (cherry-pick --reset-author; the commit-msg hook strips trailers) through
# ops/fleet_kit/fleet_gitlock.py and pushed; the PR closes when it lands.
#
# Security alerts are a separate GitHub feature and are NOT configured here;
# this file only schedules version-update PRs.

version: 2
updates:
  # Every `uses:` in .github/workflows/ is pinned to a full commit SHA with the
  # release tag as a trailing comment. Dependabot updates the SHA and the
  # comment together - this entry is how those pins stay current.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(deps)"
    groups:
      github-actions:
        patterns: ["*"]

  # "/"                   requirements.in - the runtime pins (exact `==`, no
  #                       hashes) - and requirements.txt, the HASHED lock
  #                       generated from it (regeneration command in both
  #                       headers; PUBREPO e).
  # "/.github/ci"         the HASHED CI install sets (requirements-*.txt,
  #                       generated from the .in beside each; the regeneration
  #                       command is in each .in header). ci.yml checks that
  #                       every runtime pin in requirements.in agrees with the
  #                       hashed set, so a bump that updates one and not the
  #                       other goes red (PR #11, 2026-10-12, failed exactly
  #                       so: it bumped "/" only). Apply such a bump locally
  #                       to requirements.in and regenerate all three files.
  # "/oss/win32_atomic_io" the extracted package's pyproject (stdlib-only
  #                       today; listed so a dependency added later is seen).
  - package-ecosystem: pip
    directories:
      - "/"
      - "/.github/ci"
      - "/oss/win32_atomic_io"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(deps)"
    groups:
      pip:
        patterns: ["*"]
    # Declined bumps (closing a group PR does not ignore its versions). Each
    # range runs from just above the current pin up to the declined target:
    # Dependabot offers the newest version not ignored, so ignoring only the
    # target would reopen the PR one release lower. A release above a range
    # still opens a PR. Drop an entry when its hold lifts.
    ignore:
      # PR #11: held until RM-681 (live call per path + truststore) closes.
      - dependency-name: "anthropic"
        versions: [">1.11.0,<=1.13.0"]
      # PR #11: wait for a change that also upgrades the RC runtime.
      - dependency-name: "json5"
        versions: [">0.15.0,<=0.17.3"]
      - dependency-name: "pydantic"
        versions: [">2.13.5,<=2.14.1"]

  # npm: every tracked package.json that declares dependencies. NONE carries a
  # tracked lockfile - package-lock.json is gitignored repo-wide - so
  # Dependabot updates the package.json ranges only. lane-widget/package.json
  # declares no dependencies at all and is deliberately not listed.
  - package-ecosystem: npm
    directories:
      - "/rc-shell"
      - "/ops/audit/lolmath_ds_sweep"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm:
        patterns: ["*"]
    # Declined bump, same range rule as the pip entry above.
    ignore:
      # PR #12: rc-shell stays on electron 44.5.1 (the attended E1 shell
      # check, LEDGER 1697) until the next attended E1 check on a newer one.
      - dependency-name: "electron"
        versions: [">44.5.1 <=44.7.0"]
