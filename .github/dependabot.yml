# Dependabot version updates (supply-chain order, 2026-10-05, item 2.1).
#
# One `updates` entry per ecosystem actually present in this tree, weekly, and
# ONE group per ecosystem so a week is at most one PR per ecosystem, not a
# burst. Nothing here auto-merges, and a Dependabot PR is NEVER merged on
# GitHub in any mode (MAIN kit-v13/v14 ORDER section 4: a squash keeps the bot
# as author, a web merge writes a non-operator committer; MAIN ORDER
# 2026-10-19-0034 DEPENDABOT-MERGE-RULE: RC takes its path B only). Once its
# gating CI (ci.yml) is green, the bump is applied LOCALLY as an operator
# commit: `git cherry-pick --no-commit <sha>` of the PR head (a plain
# cherry-pick keeps the bot author and never runs the commit-msg hook; git has
# no `cherry-pick --reset-author`), any hashed lock regenerated locally (a
# Dependabot regen drops the multi-Python markers), then committed through
# ops/fleet_kit/fleet_gitlock.py with an operator-written message and pushed;
# the PR closes when it lands. After any bot-PR landing, and at /done after
# the push, `python tools/bot_merge_check.py` scans the new default-branch
# commits for a non-operator identity or any Co-authored-by line.
#
# Security alerts are a separate GitHub feature and are NOT configured here;
# this file only schedules version-update PRs.

version: 2
updates:
  # Every `uses:` in .github/workflows/ is pinned to a full commit SHA with the
  # release tag as a trailing comment. Dependabot updates the SHA and the
  # comment together - this entry is how those pins stay current.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(deps)"
    groups:
      github-actions:
        patterns: ["*"]

  # "/"                   requirements.in - the runtime pins (exact `==`, no
  #                       hashes) - and requirements.txt, the HASHED lock
  #                       generated from it (regeneration command in both
  #                       headers; PUBREPO e).
  # "/.github/ci"         the HASHED CI install sets (requirements-*.txt,
  #                       generated from the .in beside each; the regeneration
  #                       command is in each .in header). ci.yml checks that
  #                       every runtime pin in requirements.in agrees with the
  #                       hashed set, so a bump that updates one and not the
  #                       other goes red (PR #11, 2026-10-12, failed exactly
  #                       so: it bumped "/" only). Apply such a bump locally
  #                       to requirements.in and regenerate all three files.
  # "/oss/win32_atomic_io" the extracted package's pyproject (stdlib-only
  #                       today; listed so a dependency added later is seen).
  - package-ecosystem: pip
    directories:
      - "/"
      - "/.github/ci"
      - "/oss/win32_atomic_io"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(deps)"
    groups:
      pip:
        patterns: ["*"]
    # Declined bumps (closing a group PR does not ignore its versions). Each
    # range runs from just above the current pin up to the declined target:
    # Dependabot offers the newest version not ignored, so ignoring only the
    # target would reopen the PR one release lower. A release above a range
    # still opens a PR. Drop an entry when its hold lifts.
    ignore:
      # PR #11 (1.13.0), PR #17 (1.14.0, declined 2026-10-17), PR #19
      # (1.15.0, declined 2026-10-20), PR #24 (2.1.0, a major whose 2.0.0
      # moves to API version 2026-10-21 and adds opentelemetry-api; declined
      # 2026-10-26 under the same hold, its other bumps applied) and PR #26
      # (2.2.0, declined 2026-10-26, its certifi bump applied; 2.x is also
      # relicensed MIT -> Apache-2.0 from 2.0.0): held until RM-681 (live
      # call per path + truststore) closes.
      - dependency-name: "anthropic"
        versions: [">1.11.0,<=2.2.0"]
      # PR #11: wait for a change that also upgrades the RC runtime.
      - dependency-name: "json5"
        versions: [">0.15.0,<=0.17.3"]
      - dependency-name: "pydantic"
        versions: [">2.13.5,<=2.14.1"]

  # npm: every tracked package.json that declares dependencies.
  # package-lock.json is gitignored repo-wide EXCEPT rc-shell/package-lock.json,
  # which is tracked since PKG-8 (.gitignore negation), so an rc-shell bump
  # must regenerate that lock when it lands (path B:
  # npm install --package-lock-only --ignore-scripts in rc-shell). The
  # ops/audit/lolmath_ds_sweep lock stays ignored, so Dependabot updates its
  # package.json ranges only. lane-widget/package.json declares no
  # dependencies at all and is deliberately not listed.
  - package-ecosystem: npm
    directories:
      - "/rc-shell"
      - "/ops/audit/lolmath_ds_sweep"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm:
        patterns: ["*"]
    # Held bump. Not the pip range rule: the hold covers EVERY electron minor
    # and patch above the current pin, so a range would reopen a PR for each
    # weekly patch.
    ignore:
      # PR #12 (44.7.0), PR #14 (44.7.1) and PR #16 (44.7.2), all declined
      # while rc-shell stayed on 44.5.1 (the attended E1 shell check, LEDGER
      # 1697). 44.9.1 landed by MAIN FIX (RM-908); the 45.0.0 major landed
      # from PR #25 (DEP-25, s142) with the attended E1 check on 45 still
      # owed. Minor and patch updates are ignored; a new major still opens a
      # PR. Security alerts are not governed by this file. Drop the entry
      # when the hold lifts.
      - dependency-name: "electron"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
