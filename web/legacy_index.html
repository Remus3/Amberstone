    const badge = document.getElementById('mode-badge');
    badge.dataset.mode = modeKey;
    // Friendlier badge text: "game" (SR) → "RANKED SR"; others stay uppercase key.
    const gm = (c.game_mode || '').toUpperCase();
    badge.textContent = (modeKey === 'game' && gm === 'CLASSIC')
      ? 'RANKED SR'
      : modeKey.toUpperCase();

    logCoachChanges(c);
    // Mode transition: toast if flagged messages need review before flush.
    if (_lastSeenMode && _lastSeenMode !== modeKey) {
      const flagged = _chatMsgs.filter(m => m.flagged && !m.reviewed);
      chatLog('system', 'mode', `${_lastSeenMode} \u2192 ${modeKey}`, false);
      if (flagged.length) {
        toast(`Mode changed. ${flagged.length} flagged message${flagged.length===1?'':'s'} pending review — tap \ud83d\uddd1`, true);
      }
    }
    _lastSeenMode = modeKey;
    setText('clock', c.game_time || fmtClock(c.game_time_s));
    setText('kda',   c.kda || '—');
    // WIN% is rendered inside renderObjectivesTracker (avoids digest-rebuild
    // flicker where it would reset to an em-dash).
    const actionRaw = c.action || (modeKey === 'client' ? 'WAITING FOR GAME' : '');
    const abEl = document.getElementById('action-bar');
    if (abEl) abEl.innerHTML = actionRaw ? markupHTML(actionRaw) : '—';

    const inGame = !(modeKey === 'client' || !h.has_game);
    // Mode transition: leaving game → undock chat, reset built flag.
    if (!inGame && _gameLayoutBuilt) {
      undockChat();
      _gameLayoutBuilt = false;
      _lastGameDigest = '';
    }
    if (!inGame) {
      // Build the lobby once; refresh response + LCU sub-panel on ticks.
      const lcu = s.lcu || {};
      if (!document.getElementById('lobby-resp')) {
        await loadChampMap();
        renderClient(c, lcu);
      } else {
        renderLobbyResponse(c);
        // Replace LCU panel in place (4th column) so phase/bench updates live
        const wrap = document.querySelector('.lobby');
        if (wrap && wrap.children.length >= 4) {
          const newPanel = renderLcuPanel(lcu);
          wrap.replaceChild(newPanel, wrap.children[3]);
        }
      }
    } else {
      if (!CHAMP_MAP) await loadChampMap();
      renderGame(c, s.liveclient || {});
    }

    const dot = document.getElementById('dot');
    const ft  = document.getElementById('footer-text');
    const ageUI = h.ui_pulse_age_s;
    const cls = (!h.alive) ? 'dead' : (ageUI != null && ageUI > 5 ? 'stale' : 'alive');
    dot.className = 'dot ' + cls;
    ft.textContent = `pid=${h.pid||'?'} mode=${h.mode||'?'} ui=${(ageUI||0).toFixed(1)}s src=${(s.coach_source||'').split('/').pop()}`;
  } catch (e) {
    const dot = document.getElementById('dot');
    dot.className = 'dot dead';
    document.getElementById('footer-text').textContent = 'RC unreachable';
  }
}
tick();
setInterval(tick, 500);
// Real-world clock in header (12-hr + AM/PM) + compact HH:MM next to the chat entry.
function tickRTClock() {
  const d = new Date();
  let h = d.getHours();
  const ampm = h >= 12 ? 'PM' : 'AM';
  h = h % 12; if (h === 0) h = 12;
  const mm = String(d.getMinutes()).padStart(2,'0');
  const ss = String(d.getSeconds()).padStart(2,'0');
  const el = document.getElementById('rtclock');
  if (el) el.textContent = h + ':' + mm + ':' + ss + ' ' + ampm;
  const cts = document.getElementById('chat-ts');
  if (cts) cts.textContent = h + ':' + mm;
}
tickRTClock();
setInterval(tickRTClock, 1000);

// ── Input + commands ─────────────────────────────────────────────────────
const TOAST = document.getElementById('toast');
let toastTimer = null;
function toast(msg, isErr) {
  TOAST.textContent = msg;
  TOAST.className = 'toast show' + (isErr ? ' err' : '');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ TOAST.className = 'toast'; }, 2200);
}
async function postJSON(url, body) {
  const r = await fetch(url, {method:'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify(body)});
  if (!r.ok) throw new Error('HTTP '+r.status);
  return r.json();
}
const INP = document.getElementById('inp');
const CHAT_LOG = document.getElementById('chat-log');
const CHAT_STORAGE_KEY = 'rc-chat-log-v1';
const CHAT_STORAGE_MAX = 500;   // persisted history cap
const CHAT_UI_MAX_ROWS = 200;   // DOM cap (scroll handles overflow)
// Prefixes that mark a user message as flagged for review. Case-insensitive,
// whole word or "!" prefix.
const FLAG_RE = /^\s*(issue\b|problem\b|error\b|broken\b|missing\b|bug\b|fix\b|todo\b|!)/i;

let _chatMsgs = [];   // in-memory mirror of localStorage

function hhmmFromTs(ts) {
  const d = new Date(ts || Date.now());
  return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}
function hhmm() { return hhmmFromTs(Date.now()); }
function chatStorageLoad() {
  try {
    const raw = localStorage.getItem(CHAT_STORAGE_KEY);
    if (!raw) return [];
    const arr = JSON.parse(raw);
    return Array.isArray(arr) ? arr : [];
  } catch { return []; }
}
function chatStorageSave() {
  try {
    const trimmed = _chatMsgs.slice(-CHAT_STORAGE_MAX);
    _chatMsgs = trimmed;
    localStorage.setItem(CHAT_STORAGE_KEY, JSON.stringify(trimmed));
  } catch (e) { /* quota — ignore */ }
}
function isFlagged(kind, text) {
  if (kind !== 'user') return false;
  return FLAG_RE.test(String(text || ''));
}
function renderChatRow(msg) {
  if (!CHAT_LOG) return null;
  const row = document.createElement('div');
  row.className = 'msg ' + msg.kind +
    (msg.flagged ? ' flagged' : '') +
    (msg.reviewed ? ' reviewed' : '') +
    (msg.delivered ? ' delivered' : '');
  const body = msg.isHtml ? msg.text
    : String(msg.text).replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const bang = msg.flagged
    ? ` <span class="flag-bang" data-idx="${msg._idx}" title="${msg.reviewed?'reviewed':'click to mark reviewed'}">!</span>`
    : '';
  // Timestamps removed from per-message rendering (user preference);
  // the current-time indicator lives next to the chat input instead.
  row.innerHTML =
    (msg.src ? `<span class="src">${msg.src}:</span> ` : '') +
    body + bang;
  if (msg._idx != null) row.dataset.idx = msg._idx;
  CHAT_LOG.appendChild(row);
  while (CHAT_LOG.children.length > CHAT_UI_MAX_ROWS) {
    CHAT_LOG.removeChild(CHAT_LOG.firstChild);
  }
  CHAT_LOG.scrollTop = CHAT_LOG.scrollHeight;
  return row;
}
function chatLog(kind, src, text, isHtml) {
  const flagged = isFlagged(kind, text);
  const msg = {
    ts: Date.now(), kind, src, text, isHtml: !!isHtml,
    flagged, reviewed: false,
  };
  _chatMsgs.push(msg);
  msg._idx = _chatMsgs.length - 1;
  chatStorageSave();
  return renderChatRow(msg);
}
function chatReplay() {
  _chatMsgs = chatStorageLoad();
  // Reindex after load so _idx matches array position.
  _chatMsgs.forEach((m, i) => { m._idx = i; });
  if (CHAT_LOG) CHAT_LOG.innerHTML = '';
  for (const m of _chatMsgs) renderChatRow(m);
}
// Mark flagged messages reviewed by clicking the "!" badge
if (CHAT_LOG) {
  CHAT_LOG.addEventListener('click', (e) => {
    const b = e.target.closest('.flag-bang');
    if (!b) return;
    const idx = parseInt(b.dataset.idx, 10);
    if (isNaN(idx) || !_chatMsgs[idx]) return;
    _chatMsgs[idx].reviewed = !_chatMsgs[idx].reviewed;
    chatStorageSave();
    // Toggle row class inline to avoid full replay
    const row = b.closest('.msg');
    if (row) {
      row.classList.toggle('reviewed', _chatMsgs[idx].reviewed);
      b.title = _chatMsgs[idx].reviewed ? 'reviewed' : 'click to mark reviewed';
    }
  });
}

// ── Flush workflow ──────────────────────────────────────────────────
const FLUSH_OVL     = document.getElementById('flush-ovl');
const FLUSH_TITLE   = document.getElementById('flush-title');
const FLUSH_BODY    = document.getElementById('flush-body');
const FLUSH_LIST    = document.getElementById('flush-list');
const FLUSH_ACTIONS = document.getElementById('flush-actions');
function flushClose() { FLUSH_OVL.classList.remove('open'); }
function flushDo() {
  _chatMsgs = [];
  chatStorageSave();
  CHAT_LOG.innerHTML = '';
  _lastCoachAction = ''; _lastCoachImmediate = '';
  flushClose();
  toast('Chat log flushed');
}
async function flushSubmitFlaggedToBridge(flagged) {
  const summary = 'Flagged dashboard entries (' + flagged.length + '):\n' +
    flagged.map(m => `[${hhmmFromTs(m.ts)}] ${m.text}`).join('\n');
  try {
    await postJSON('/api/bridge', {source: 'dashboard', summary});
    // Mark them reviewed so they don't re-prompt
    flagged.forEach(m => { m.reviewed = true; });
    chatStorageSave();
    toast('Flagged items submitted to bridge (' + flagged.length + ')');
    return true;
  } catch (e) {
    toast('Bridge submit failed: ' + e.message, true);
    return false;
  }
}
function flushOpen() {
  const flagged = _chatMsgs.filter(m => m.flagged && !m.reviewed);
  FLUSH_LIST.innerHTML = '';
  FLUSH_ACTIONS.innerHTML = '';
  if (flagged.length === 0) {
    FLUSH_TITLE.textContent = 'Flush chat log?';
    FLUSH_BODY.textContent = _chatMsgs.length + ' message' +
      (_chatMsgs.length === 1 ? '' : 's') + ' in session. This clears ' +
      'the visible log and localStorage.';
    FLUSH_LIST.style.display = 'none';
    const cancel = document.createElement('button');
    cancel.textContent = 'Cancel'; cancel.onclick = flushClose;
    const go = document.createElement('button');
    go.textContent = 'Flush'; go.className = 'primary'; go.onclick = flushDo;
    FLUSH_ACTIONS.append(cancel, go);
  } else {
    FLUSH_TITLE.textContent =
      flagged.length + ' flagged message' + (flagged.length===1?'':'s') + ' pending review';
    FLUSH_BODY.textContent =
      'Review these before flushing. Submit to bridge exports them to the ' +
      'cross-Claude log so they are not lost.';
    FLUSH_LIST.style.display = '';
    for (const m of flagged) {
      const fi = document.createElement('div');
      fi.className = 'fi';
      fi.innerHTML =
        `<span class="ts">${hhmmFromTs(m.ts)}</span>` +
        String(m.text).replace(/</g,'&lt;').replace(/>/g,'&gt;');
      FLUSH_LIST.appendChild(fi);
    }
    const cancel = document.createElement('button');
    cancel.textContent = 'Cancel'; cancel.onclick = flushClose;
    const markAll = document.createElement('button');
    markAll.textContent = 'Mark all reviewed';
    markAll.onclick = () => {
      flagged.forEach(m => m.reviewed = true);
      chatStorageSave();
      chatReplay();
      flushClose();
      toast('Marked ' + flagged.length + ' reviewed');
    };
    const submit = document.createElement('button');
    submit.textContent = 'Submit to bridge + flush';
    submit.className = 'primary';
    submit.onclick = async () => {
      const ok = await flushSubmitFlaggedToBridge(flagged);
      if (ok) flushDo();
    };
    const forceFlush = document.createElement('button');
    forceFlush.textContent = 'Flush anyway';
    forceFlush.className = 'danger';
    forceFlush.onclick = flushDo;
    FLUSH_ACTIONS.append(cancel, markAll, submit, forceFlush);
  }
  FLUSH_OVL.classList.add('open');
}
FLUSH_OVL.addEventListener('click', (e) => {
  if (e.target === FLUSH_OVL) flushClose();
});
async function sendInput() {
  const text = INP.value.trim();
  if (!text) return;
  document.getElementById('btn-send').disabled = true;
  const row = chatLog('user', 'you', text);
  try {
    await postJSON('/api/input', {text});
    INP.value = '';
    // Coach reads pregame on its next poll; auto-clear after 8s.
    setTimeout(() => {
      postJSON('/api/command', {command:'clear_pregame'}).catch(()=>{});
      if (row) row.classList.add('delivered');
    }, 8000);
  } catch (e) {
    chatLog('system', 'err', 'send failed: ' + e.message);
    toast('Send failed: '+e.message, true);
  } finally {
    document.getElementById('btn-send').disabled = false;
  }
}
async function command(cmd, label) {
  try {
    await postJSON('/api/command', {command: cmd});
    toast(label+' ✓');
  } catch (e) {
    toast(label+' failed', true);
  }
}
document.getElementById('btn-send').addEventListener('click', sendInput);
document.getElementById('btn-scan').addEventListener('click',  ()=>command('force_vision','Vision scan'));
document.getElementById('btn-coach').addEventListener('click', ()=>command('refresh','Refresh'));
document.getElementById('btn-clear').addEventListener('click', () => {
  // Wipe the input text entry and also clear server-side pregame so any
  // in-flight text the coach was about to consume is also dropped.
  if (INP) { INP.value = ''; INP.focus(); }
  command('clear_pregame', 'Entry cleared');
});
document.getElementById('btn-flush').addEventListener('click', flushOpen);

// Replay persisted chat log, then seed "last seen" coach fields from the
// most recent coach entry so we don't re-log an unchanged coach immediate
// after reload.
chatReplay();
for (let i = _chatMsgs.length - 1; i >= 0; i--) {
  if (_chatMsgs[i].kind === 'coach') {
    _lastCoachImmediate = _chatMsgs[i].text.replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/<[^>]+>/g,'');
    break;
  }
}
INP.addEventListener('keydown', (e)=>{
  if (e.key === 'Enter') { e.preventDefault(); sendInput(); }
});
</script>
