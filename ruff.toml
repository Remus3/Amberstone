# ruff.toml - Riot Commander
# Conservative config: catches real errors without churn
# py39-compatible (project targets Python 3.9+)

target-version = "py39"
line-length = 120

[lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes (undefined names, unused imports)
    "I",    # isort (import ordering)
    "UP",   # pyupgrade (safe modern syntax)
    "B",    # flake8-bugbear (common bugs)
    "BLE",  # flake8-blind-except - ratchet: no NEW bare `except Exception`
]
ignore = [
    "E501",   # line too long - not enforced
    "E701",   # multiple statements on one line - deliberate style in this codebase
    "E702",   # statement ends with semicolon - deliberate in one-liners
    "E741",   # ambiguous variable names - common in short math/callbacks
    "B008",   # function calls in default args - used intentionally
    "B006",   # mutable default args - known pattern in project
    "UP007",  # X | Y union syntax - requires py310, project targets py39
    "UP035",  # deprecated typing imports - keep for py39 compat
    "UP037",  # remove quoted annotations - frozen files carry quoted forward-refs
    "F401",   # imported but unused - too noisy, especially in __init__.py
    "F841",   # local variable assigned but never used - noisy in callbacks
    "I001",   # import block unsorted - defer to a dedicated cleanup pass
    "UP006",  # Dict/List -> dict/list - py39 supports both, cosmetic only
    "UP045",  # Optional[X] -> X | None - requires py310, project targets py39
    "E402",   # module import not at top - unavoidable in ops/ sys.path scripts
    "B904",   # raise without from inside except - existing RC style
    "B007",   # unused loop variable - intentional in callbacks
    "B027",   # empty method without abstract - BaseCoach stub pattern
    "E731",   # lambda assignment - intentional one-liners in RC
]

# Don't lint generated/runtime/cache dirs
exclude = [
    "__pycache__",
    ".venv",
    "ops/staging",
    "ops/backups",
    "ops/runtime",
    "data",
    "logs",
]

[lint.per-file-ignores]
"ops/*.py" = ["B"]          # ops scripts are procedural, bugbear too strict
"scripts/*.py" = ["B", "I"] # one-off scripts, ignore import order
"*/__init__.py" = ["F401"]  # __init__.py re-exports are expected
# DS engine + its curated tools are a fail-soft external compute package; the
# BLE001 ratchet is scoped to app code, not the engine package.
"agents/daemon_slayer/**" = ["BLE001"]
"tools/daemon_slayer_*.py" = ["BLE001"]
"tools/ds_*.py" = ["BLE001"]
"tools/start_daemon_slayer.py" = ["BLE001"]
# Frozen app/ submodules use quoted forward-refs to OverlayApp/GameEnvelope
# (circular-import prevention) - ruff can't resolve them as F821. BLE001 is
# baselined here via config (frozen files take no inline noqa without approval).
"app/_game_lifecycle.py" = ["F821", "BLE001"]
"app/_health_monitor.py" = ["F821", "BLE001"]
"app/_overlay_manager.py" = ["F821", "BLE001"]
"app/_remediation.py"    = ["F821", "BLE001"]
"app/_state_authority.py" = ["F821", "BLE001"]
"main.py" = ["BLE001"]
"app/__init__.py" = ["BLE001"]
"app/_loop.py" = ["BLE001"]
"core/log_setup.py" = ["BLE001"]
"core/moon_proxy.py" = ["BLE001"]
"core/game_snapshot.py" = ["BLE001"]
"lcu/lcu_client.py" = ["BLE001"]
"ops/rc_dev_runtime.py" = ["B", "BLE001"]
"ops/rc_supervisor.py" = ["B", "BLE001"]
"dashboard/routes_bridge_pending.py" = ["BLE001"]
# Frozen bridge tools - exclude all lint upgrades to prevent auto-fix drift
"tools/bridge_pull_tasks.py"   = ["UP", "E", "B", "BLE001"]
"tools/bridge_post_result.py"  = ["UP", "E", "B", "BLE001"]
"tools/bridge_watcher_classify.py" = ["BLE001"]
"tools/bridge_watcher_actions.py" = ["BLE001"]
"tools/bridge_watcher_history.py" = ["BLE001"]

[lint.isort]
known-first-party = [
    "tft", "ui", "modes", "modules", "lcu",
    "coaches", "ops",
]
