[pytest]
# Exclude the public Share/ mirror from collection. Share/ ships a vendored
# copy of the DS engine + its full test suite whose file basenames (test_*.py,
# __init__.py) duplicate the main tree. Under full-root collection that
# duplication triggers pytest "import file mismatch" plus a spurious
# ModuleNotFoundError: agents.agent3_testing. The Share package is validated
# from inside Share/, not from the repo root, so the root run skips it.
norecursedirs = Share python-embed .* build dist CVS _darcs {arch} *.egg venv node_modules __pycache__
