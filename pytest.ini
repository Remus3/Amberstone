[pytest]
norecursedirs = python-embed .* build dist CVS _darcs {arch} *.egg venv node_modules __pycache__ moon_sync_inbox .claude worktrees rc-worktrees ops/runtime responder_export _scratch _archive Share data logs

# Temp-dir retention. Added 2026-09-19 after tmp_path dirs were found to be a
# major contributor to a bloated %TEMP% (68,630 files across only ~9 runs),
# which pushed the User Profile Service to ~155s at every logon and made the
# machine take ~2m50s to boot.
#   keep temp dirs only for FAILED tests, and only the last run of them
tmp_path_retention_policy = failed
tmp_path_retention_count = 1

# An empty parametrize list is a COLLECTION ERROR, never a silent skip.
# Added 2026-09-21: tests/test_loop_concurrency.py parametrizes the cross-repo
# digest check over sorted(SHARED_SHA256); emptied, that guard would quietly
# turn into skips and read as green. Pinned by
# tests/test_pytest_ini_empty_parameter_set.py.
empty_parameter_set_mark = fail_at_collect

# Collection isolation. Added 2026-10-09 after a merge agent's suite-gate run
# expanded an empty path list into a BARE `pytest -q` at the repo root: with no
# testpaths and no channel-dir exclusion, pytest walked the whole checkout and
# IMPORTED the sibling test modules delivered under the gitignored
# moon_sync_inbox/ (25 .pyc written there), i.e. untrusted code ran here.
#   testpaths: a bare root run (no path, or only -k / -m) collects the two RC
#     suite roots and nothing else. Every other tree (tools/tests,
#     oss/win32_atomic_io/tests, agents/agent3_testing) is run by naming it.
#   norecursedirs (line 2, extended in place so `pytest.ini:2` citations hold):
#     moon_sync_inbox = inbound sibling mail (untrusted); .claude worktrees
#     rc-worktrees = agent / lane worktree bases (other checkouts);
#     ops/runtime responder_export = runtime output incl. a full repo copy;
#     _scratch _archive Share data logs = scratch, dated artifacts, the
#     retired DS mirror and data / log output. `pytest .` skips
#     them; an explicitly named path is still collected.
# Pinned by tests/test_pytest_collect_isolation.py, which also fails if a
# generic name here would swallow a real test directory under a suite root.
testpaths = tests agents/daemon_slayer
