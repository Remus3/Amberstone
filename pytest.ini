[pytest]
norecursedirs = python-embed .* build dist CVS _darcs {arch} *.egg venv node_modules __pycache__

# Temp-dir retention. Added 2026-09-19 after tmp_path dirs were found to be a
# major contributor to a bloated %TEMP% (68,630 files across only ~9 runs),
# which pushed the User Profile Service to ~155s at every logon and made the
# machine take ~2m50s to boot.
#   keep temp dirs only for FAILED tests, and only the last run of them
tmp_path_retention_policy = failed
tmp_path_retention_count = 1

# An empty parametrize list is a COLLECTION ERROR, never a silent skip.
# Added 2026-09-21: tests/test_loop_concurrency.py parametrizes the cross-repo
# digest check over sorted(SHARED_SHA256); emptied, that guard would quietly
# turn into skips and read as green. Pinned by
# tests/test_pytest_ini_empty_parameter_set.py.
empty_parameter_set_mark = fail_at_collect
